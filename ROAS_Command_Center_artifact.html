  const meta={STOP:{ic:"🔴",t:"STOP — matikan / turunkan budget",cls:"rugi",col:"var(--red)"},PUSH:{ic:"🟢",t:"PUSH — scale budget",cls:"aman",col:"var(--green)"},MONITOR:{ic:"🟡",t:"MONITOR — tahan & optimize",cls:"waspada",col:"var(--amber)"}};
  let h="";

  // ---- SEKSI VARIAN RUGI (bocor tersembunyi di dalam parent) ----
  const lv=collectLosingVariants(actionsUI.store||null);
  if(lv.length && (!actionsUI.gate || actionsUI.gate==="STOP")){
    const hiddenN=lv.filter(x=>x.hidden).length;
    // Product ID unik dari parent yg punya varian rugi (buat tempel ke TikTok)
    const pidSet=[...new Set(lv.map(x=>x.parent.productId).filter(Boolean))];
    const pidStr=pidSet.join(", ");
    h+=`<div class="card" style="padding:0;margin-bottom:18px;overflow:hidden;border-left:3px solid var(--red)">
      <div style="display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--panel)">
        <b style="font-size:14px">🩸 Varian Rugi</b>
        <span class="badge" style="margin-left:6px">${lv.length} varian</span>
        ${hiddenN?`<span class="chip rugi" style="padding:1px 8px" data-tip="Varian rugi yang bersembunyi di parent berstatus AMAN/WASPADA">${hiddenN} tersembunyi di parent aman</span>`:''}
      </div>
      <div class="tbl-wrap"><table class="dt"><thead><tr>
        <th data-tip="Toko">Toko</th><th data-tip="Parent SKU + status parent">Parent</th><th data-tip="Seller SKU varian">Seller SKU</th><th data-tip="Nama variasi">Variasi</th>
        <th style="text-align:right" data-tip="ROAS diwarisi dari parent">ROAS</th><th style="text-align:right">HPP</th><th style="text-align:right">Harga</th>
        <th style="text-align:right" data-tip="Profit aktual per order di varian ini">Profit</th><th style="text-align:right">Profit %</th>
        <th style="text-align:right" data-tip="Harga jual agar profit varian = 10%">Saran Harga</th><th style="text-align:right" data-tip="Sisa stok varian">Stok</th></tr></thead><tbody>`;
    lv.forEach(({store,parent,parentStatus,v,vc})=>{
      const pStatChip = parentStatus==="AMAN"?'<span class="chip aman" style="padding:0 5px;font-size:9px">AMAN</span>':(parentStatus==="WASPADA"?'<span class="chip waspada" style="padding:0 5px;font-size:9px">WASPADA</span>':'<span class="chip rugi" style="padding:0 5px;font-size:9px">RUGI</span>');
      h+=`<tr>
        <td>${store}</td>
        <td class="sku" style="font-size:11px">${parent.sku||'–'} ${pStatChip}</td>
        <td class="sku" style="font-size:11px">${v.sku||'–'}</td>
        <td style="font-size:11.5px">${v.variasi||'—'}</td>
        <td class="num">${fmtX(parent.roasAktual)}</td>
        <td class="num">${v.hpp!=null?fmtN(v.hpp):fmtN(parent.hpp)+'*'}</td>
        <td class="num">${v.hargaJual!=null?fmtN(v.hargaJual):'—'}</td>
        <td class="num neg">${vc.profitAkt!=null?fmtN(vc.profitAkt):'—'}</td>
        <td class="num neg">${vc.profitAktPct!=null?fmtPct(vc.profitAktPct):'—'}</td>
        <td class="num">${varSaranHargaCell(vc,false)}</td>
        <td class="num" style="color:var(--txt-dim)">${v.stok!=null?fmtN(v.stok):'—'}</td></tr>`;
    });
    h+=`</tbody></table></div>
      <div style="padding:12px 16px;background:var(--panel);border-top:1px solid var(--stroke)">
        <div style="font-size:11px;color:var(--txt-dim);margin-bottom:6px">Product ID parent yang punya varian rugi (${pidSet.length} produk) — cek harga/HPP varian di dalamnya</div>
        <div style="display:flex;gap:10px;align-items:flex-start">
          <code style="flex:1;font-size:11px;background:var(--bg);padding:9px 11px;border-radius:8px;word-break:break-all;color:var(--txt-dim);font-family:var(--mono)">${pidStr||'—'}</code>
          <button class="btn sm primary" id="lvCopy" style="white-space:nowrap">📋 Salin</button>
        </div>
      </div></div>`;
  }

  order.forEach(gk=>{
    const arr=groups[gk]; if(!arr.length)return;
    const m=meta[gk];
    const pids=pidList(arr);
    const noPid=arr.some(x=>!x.r.productId);
    h+=`<div class="card" style="padding:0;margin-bottom:18px;overflow:hidden;border-left:3px solid ${m.col}">
      <div style="display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--panel)">
        <b style="font-size:14px">${m.ic} ${m.t}</b>
        <span class="badge" style="margin-left:6px">${arr.length} SKU</span>
      </div>
      <div class="tbl-wrap"><table class="dt"><thead><tr>
        <th data-tip="Toko asal">Toko</th><th data-tip="Kode SKU">SKU</th><th data-tip="Product ID untuk Seller Center">Product ID</th>
        <th style="text-align:right" data-tip="ROAS aktual">ROAS</th><th style="text-align:right" data-tip="Target ROAS ideal per SKU">Target</th>
        <th style="text-align:right" data-tip="ROAS titik impas">BEP</th><th style="text-align:right" data-tip="Profit Aktual % = Profit Aktual ÷ Harga Final. Persentase untung nyata per order pada ROAS aktual.">Profit Aktual %</th><th style="text-align:right" data-tip="Profit absolut periode (profit/order × order)">Profit Total</th>
        <th data-tip="Rekomendasi tindakan">Aksi</th></tr></thead><tbody>`;
    arr.forEach(({store,r,c,g})=>{
      h+=`<tr><td>${store}</td><td class="sku">${r.sku||"–"}</td>
        <td class="sku" style="font-size:11px;color:var(--txt-dim)">${r.productId||'<span style="color:var(--red)">—</span>'}</td>
        <td class="num">${fmtX(c.roasAkt)}</td><td class="num">${fmtX(c.targetRoasIdeal)}</td><td class="num">${fmtX(c.roasBEP)}</td>
        <td class="num ${c.profitAktPct!=null&&c.profitAktPct<0?'neg':(c.profitAktPct!=null&&c.profitAktPct>0?'pos':'')}">${c.profitAktPct!=null?fmtPct(c.profitAktPct):'<span style="color:var(--txt-faint)">—</span>'}</td>
        <td class="num ${g.profitTot!=null&&g.profitTot<0?'neg':''}">${g.profitTot!=null?fmtRp(g.profitTot):'<span style="color:var(--txt-faint)">—</span>'}</td>
        <td style="font-size:11.5px">${g.action}</td></tr>`;
    });
    h+=`</tbody></table></div>
      <div style="padding:12px 16px;background:var(--panel);border-top:1px solid var(--stroke)">
        <div style="font-size:11px;color:var(--txt-dim);margin-bottom:6px">Product ID (siap tempel ke TikTok Shop Seller Center)${noPid?' <span style="color:var(--red)">⚠ sebagian pakai SKU — import campaign untuk isi Product ID</span>':''}</div>
        <div style="display:flex;gap:10px;align-items:flex-start">
          <code style="flex:1;font-size:11px;background:var(--bg);padding:9px 11px;border-radius:8px;word-break:break-all;color:var(--txt-dim);font-family:var(--mono)">${pids||'—'}</code>
          <button class="btn sm primary act-copy" data-gate="${gk}" style="white-space:nowrap">📋 Salin</button>
        </div>
      </div></div>`;
  });
  body.innerHTML=h;
  const lvCopyBtn=$("#lvCopy");
  if(lvCopyBtn)lvCopyBtn.onclick=()=>{
    const lv2=collectLosingVariants(actionsUI.store||null);
    const pids=[...new Set(lv2.map(x=>x.parent.productId).filter(Boolean))].join(", ");
    copyText(pids,`Product ID parent dgn varian rugi (${lv2.length} varian)`);
  };
  $$(".act-copy").forEach(b=>b.onclick=()=>{
    const gk=b.dataset.gate; const arr=(groups[gk]||[]);
    copyText(pidList(arr), `Product ID ${gk} (${arr.length} SKU)`);
  });
}

function renderAnalytics(c){
  destroyCharts();
  const rows=allRows();
  c.innerHTML=`<div class="filter-bar">
    <div class="fg"><label class="fld">Toko</label><select class="select" id="anStore"><option value="">Semua Toko</option>${STORES.map(s=>`<option>${s}</option>`).join("")}</select></div>
    <div class="fg"><label class="fld">Status</label><select class="select" id="anStatus"><option value="">Semua</option><option>AMAN</option><option>WASPADA</option><option>RUGI</option></select></div>
  </div>
  <div class="chart-grid">
    <div class="card chart-card"><h4>Margin Kotor per Toko</h4><div class="csub">Total margin sebelum iklan</div><div class="chart-box"><canvas id="chMargin"></canvas></div></div>
    <div class="card chart-card"><h4>Distribusi Status Profitabilitas</h4><div class="csub">Berdasarkan ROAS aktual</div><div class="chart-box"><canvas id="chStatus"></canvas></div></div>
    <div class="card chart-card"><h4>Target ROAS vs ROAS Aktual</h4><div class="csub">Top 15 produk (harga tertinggi)</div><div class="chart-box tall"><canvas id="chRoas"></canvas></div></div>
    <div class="card chart-card"><h4>Sebaran Margin % per Produk</h4><div class="csub">Semua produk, urut margin</div><div class="chart-box tall"><canvas id="chMarginDist"></canvas></div></div>
    <div class="card chart-card" style="grid-column:1/-1"><h4>Riwayat Perubahan Harga per Hari</h4><div class="csub">Jumlah perubahan & rata-rata selisih</div><div class="chart-box"><canvas id="chHist"></canvas></div></div>
  </div>`;
  $("#anStore").onchange=()=>drawCharts();$("#anStatus").onchange=()=>drawCharts();
  drawCharts();
}
function drawCharts(){
  destroyCharts();
  const sf=$("#anStore")?.value||"", stf=$("#anStatus")?.value||"";
  let rows=allRows(); if(sf)rows=rows.filter(r=>r._store===sf);
  let data=rows.map(r=>({r,c:calcRow(r)})); if(stf)data=data.filter(x=>x.c.status===stf);
  const gc=gridColor(),tc=txtColor();
  const cOpt=(extra={})=>Object.assign({responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:tc,font:{size:11}}}},scales:{x:{ticks:{color:tc,font:{size:10}},grid:{color:gc}},y:{ticks:{color:tc,font:{size:10}},grid:{color:gc}}}},extra);
  const grad=["#2dd4bf","#a855f7","#60a5fa","#fbbf24"];

  // margin per store
  const perStore=STORES.map(s=>aggregate(state.stores[s]).sumMargin);
  charts.margin=new Chart($("#chMargin"),{type:"bar",data:{labels:STORES,datasets:[{label:"Margin Kotor",data:perStore,backgroundColor:grad,borderRadius:8}]},options:cOpt({plugins:{legend:{display:false}}})});

  // status donut
  let aman=0,was=0,rugi=0,none=0;data.forEach(({c})=>{if(c.roasAkt==null)none++;else if(c.status==="AMAN")aman++;else if(c.status==="WASPADA")was++;else rugi++;});
  charts.status=new Chart($("#chStatus"),{type:"doughnut",data:{labels:["Aman","Waspada","Rugi","Tanpa Data"],datasets:[{data:[aman,was,rugi,none],backgroundColor:["#34d399","#fbbf24","#f87171","#5f6b8a"],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,cutout:"62%",plugins:{legend:{position:"right",labels:{color:tc,font:{size:11},padding:12}}}}});

  // roas compare
  const top=[...data].filter(x=>x.r.hargaJual).sort((a,b)=>b.c.hargaFinal-a.c.hargaFinal).slice(0,15);
  charts.roas=new Chart($("#chRoas"),{type:"bar",data:{labels:top.map(x=>x.r.sku||x.r.nama),datasets:[
    {label:"Target ROAS",data:top.map(x=>+x.c.targetRoasIdeal.toFixed(2)),backgroundColor:"#6366f1",borderRadius:6},
    {label:"ROAS Aktual",data:top.map(x=>x.c.roasAkt!=null?+x.c.roasAkt.toFixed(2):0),backgroundColor:"#2dd4bf",borderRadius:6},
    {label:"ROAS BEP",data:top.map(x=>+x.c.roasBEP.toFixed(2)),backgroundColor:"#f87171",borderRadius:6}
  ]},options:cOpt()});

  // margin distribution
  const md=[...data].filter(x=>x.r.hargaJual).sort((a,b)=>b.c.marginKotorPct-a.c.marginKotorPct);
  charts.mdist=new Chart($("#chMarginDist"),{type:"bar",data:{labels:md.map(x=>x.r.sku||x.r.nama),datasets:[{label:"Margin %",data:md.map(x=>+(x.c.marginKotorPct*100).toFixed(1)),backgroundColor:md.map(x=>x.c.marginKotorPct<0?"#f87171":x.c.marginKotorPct<0.1?"#fbbf24":"#2dd4bf"),borderRadius:5}]},options:cOpt({plugins:{legend:{display:false}}})});

  // history by day
  const byDay={};state.history.forEach(h=>{const d=new Date(h.ts).toLocaleDateString("id-ID",{day:"2-digit",month:"short"});byDay[d]=byDay[d]||{n:0,sum:0};byDay[d].n++;byDay[d].sum+=h.delta||0;});
  const days=Object.keys(byDay).reverse();
  charts.hist=new Chart($("#chHist"),{data:{labels:days,datasets:[
    {type:"bar",label:"Jml Perubahan",data:days.map(d=>byDay[d].n),backgroundColor:"#8b5cf6",borderRadius:6,yAxisID:"y"},
    {type:"line",label:"Avg Selisih (Rp)",data:days.map(d=>Math.round(byDay[d].sum/byDay[d].n)),borderColor:"#2dd4bf",backgroundColor:"#2dd4bf",tension:.3,yAxisID:"y1"}
  ]},options:cOpt({scales:{x:{ticks:{color:tc,font:{size:10}},grid:{color:gc}},y:{position:"left",ticks:{color:tc},grid:{color:gc}},y1:{position:"right",ticks:{color:tc},grid:{drawOnChartArea:false}}}})});
}

/* ============================================================
   VIEW: HISTORY
   ============================================================ */
const histUI={page:1,per:20,q:""};
function renderHistory(c){
  $("#topActions").innerHTML=`<button class="btn sm ghost" id="hExp">⬇️ Export</button><button class="btn sm danger" id="hClear">🗑 Bersihkan</button>`;
  c.innerHTML=`<div class="dt-toolbar"><div class="search-box"><span class="ico">🔍</span><input class="input" id="hSearch" placeholder="Cari SKU / toko..." value="${histUI.q}"></div>
    <select class="select" id="hStore" style="width:auto"><option value="">Semua Toko</option>${STORES.map(s=>`<option>${s}</option>`).join("")}</select></div>
    <div id="hTbl"></div><div class="pagination" id="hPag"></div>`;
  $("#hSearch").addEventListener("input",e=>{histUI.q=e.target.value.toLowerCase();histUI.page=1;drawHistory();});
  $("#hStore").onchange=()=>{histUI.page=1;drawHistory();};
  $("#hExp").onclick=exportHistoryExcel;
  $("#hClear").onclick=()=>confirmDialog("Bersihkan History","Hapus SEMUA riwayat perubahan harga? Tindakan ini tidak bisa dibatalkan.",()=>{state.history=[];save();refreshCounts();drawHistory();toast("History dibersihkan","ok");});
  drawHistory();
}
function drawHistory(){
  let list=[...state.history]; const q=histUI.q,sf=$("#hStore")?.value||"";
  if(q)list=list.filter(h=>(h.sku||"").toLowerCase().includes(q)||(h.toko||"").toLowerCase().includes(q)||(h.catatan||"").toLowerCase().includes(q));
  if(sf)list=list.filter(h=>h.toko===sf);
  const total=list.length,pages=Math.max(1,Math.ceil(total/histUI.per));if(histUI.page>pages)histUI.page=pages;
  const pg=list.slice((histUI.page-1)*histUI.per,(histUI.page-1)*histUI.per+histUI.per);
  let h=`<div class="tbl-wrap"><table class="dt"><thead><tr><th data-tip="Waktu perubahan harga tercatat">Tanggal & Waktu</th><th data-tip="Toko tempat harga diubah">Toko</th><th data-tip="Kode SKU produk">SKU</th><th data-tip="Jenis harga: HPP atau Harga Jual">Jenis</th><th style="text-align:right" data-tip="Harga sebelum diubah">Sebelum</th><th style="text-align:right" data-tip="Harga setelah diubah">Sesudah</th><th style="text-align:right" data-tip="Selisih (Sesudah − Sebelum)">Selisih</th><th data-tip="Naik / Turun / Sama">Arah</th><th data-tip="Catatan perubahan (import / manual)">Catatan</th></tr></thead><tbody>`;
  if(!pg.length)h+=`<tr><td colspan="9"><div class="empty"><div class="ic">🕓</div>Belum ada riwayat perubahan harga.</div></td></tr>`;
  pg.forEach(x=>{const dir=x.delta>0?`<span class="chip aman">NAIK</span>`:x.delta<0?`<span class="chip rugi">TURUN</span>`:`<span class="chip neutral">SAMA</span>`;
    const jenisChip=(x.jenis==="HPP")?`<span class="chip" style="background:rgba(96,165,250,.15);color:#60a5fa;padding:0 7px">HPP</span>`:`<span class="chip" style="background:rgba(168,85,247,.15);color:#a855f7;padding:0 7px">Harga Jual</span>`;
    h+=`<tr><td>${dtFmt(x.ts)}</td><td>${x.toko}</td><td class="sku">${x.sku||"–"}</td><td>${jenisChip}</td><td class="num">${fmtRp(x.sebelum)}</td><td class="num">${fmtRp(x.sesudah)}</td><td class="num ${x.delta>0?'pos':x.delta<0?'neg':''}">${x.delta>0?'+':''}${fmtN(x.delta)}</td><td>${dir}</td><td style="white-space:normal;max-width:200px">${x.catatan||"–"}</td></tr>`;});
  h+=`</tbody></table></div>`;$("#hTbl").innerHTML=h;
  drawPagination("#hPag",histUI,total,pages,drawHistory);
}
</script>
<script>
/* ============================================================
   VIEW: ROI MINGGUAN (weekly ROI/ROAS/Profit/Margin comparison)
   ============================================================ */
let wCharts={};
function destroyWCharts(){Object.values(wCharts).forEach(c=>{try{c.destroy()}catch(e){}});wCharts={};}
const weeklyUI={metric:"roas",store:"",q:"",onlyChanged:false,basePeriod:"",compPeriod:"",autoStore:false};
const W_METRICS={
  roas:{l:"ROAS Aktual",fmt:fmtX,agg:"avgRoas",higher:true},
  profit:{l:"Profit Aktual",fmt:fmtRp,agg:"sumProfit",higher:true},
  profitPct:{l:"Profit Aktual %",fmt:fmtPct,agg:"avgProfitPct",higher:true},
  margin:{l:"Margin Kotor",fmt:fmtRp,agg:"sumMargin",higher:true}
};
function renderWeekly(c){
  destroyWCharts();
  $("#topActions").innerHTML=`<select class="select sm" id="wkTopStore" style="width:auto" title="Filter per toko">
      <option value="">🏬 Semua Toko</option>${STORES.map(s=>`<option value="${s}" ${weeklyUI.store===s?"selected":""}>${s}</option>`).join("")}
    </select><button class="btn sm ghost" id="wkAdd">📸 Simpan Snapshot Minggu Ini</button><button class="btn sm ghost" id="wkExp">⬇️ Export</button>`;
  const wkTopStore=$("#wkTopStore");
  if(wkTopStore)wkTopStore.onchange=e=>{weeklyUI.store=e.target.value;renderWeekly(c);};
  $("#wkAdd").onclick=()=>{
    impLastStore="";
    const {replaced}=takeSnapshot("manual");refreshCounts();toast(replaced?"Snapshot minggu ini diperbarui":"Snapshot mingguan tersimpan","ok");renderWeekly(c);
  };
  if(!state.weekly.length){
    c.innerHTML=`<div class="card empty" style="padding:60px 20px"><div class="ic">📉</div>
      <b style="font-size:15px;color:var(--txt)">Belum ada snapshot mingguan</b>
      <p style="margin-top:8px;max-width:440px;margin-left:auto;margin-right:auto">Snapshot ROI otomatis tersimpan setiap kali kamu <b>Import Excel</b> (1 titik per minggu). Kamu juga bisa simpan manual lewat tombol "📸 Simpan Snapshot Minggu Ini" di atas.</p>
      <div style="margin-top:18px;display:flex;gap:10px;justify-content:center"><button class="btn primary" id="wkGoImport">📁 Import Sekarang</button><button class="btn" id="wkSnapNow">📸 Snapshot Manual</button></div></div>`;
    $("#wkGoImport").onclick=()=>nav("import");
    $("#wkSnapNow").onclick=()=>{impLastStore="";takeSnapshot("manual");refreshCounts();toast("Snapshot pertama tersimpan","ok");renderWeekly(c);};
    $("#wkExp").onclick=()=>toast("Belum ada data untuk diexport","err");
    return;
  }
  const weeks=state.weekly;
  // KPI header: pilih snapshot berdasarkan filter toko.
  // Jika toko dipilih → 2 snapshot terbaru toko itu. Jika "semua" → 2 snapshot terbaru toko yang sama dengan snapshot paling akhir.
  let kpiPool = weeklyUI.store ? weeks.filter(w=>(w.store||"")===weeklyUI.store) : null;
  let latest, prev, storeTag;
  if(kpiPool && kpiPool.length){
    latest=kpiPool[kpiPool.length-1];
    prev=kpiPool.length>1?kpiPool[kpiPool.length-2]:null;
    storeTag=` — ${weeklyUI.store}`;
  } else if(weeklyUI.store){
    // toko dipilih tapi belum ada snapshot-nya
    latest=null; prev=null; storeTag=` — ${weeklyUI.store}`;
  } else {
    latest=weeks[weeks.length-1];
    const sameStore=weeks.filter(w=>(w.store||"")===(latest.store||""));
    prev=sameStore.length>1?sameStore[sameStore.length-2]:null;
    storeTag=latest.store?` — ${latest.store}`:"";
  }
  if(!latest){
    c.innerHTML=`<div class="card empty" style="padding:50px 20px"><div class="ic">🔍</div><b style="font-size:15px;color:var(--txt)">Belum ada snapshot untuk ${weeklyUI.store}</b><p style="margin-top:8px">Import data toko ini dengan periode terisi agar muncul di ROI Mingguan.</p></div>`;
    return;
  }
  const M=W_METRICS[weeklyUI.metric];
  // header KPIs: latest vs prev on aggregate
  function aggKpi(key,fmt,label,ico){
    const cur=latest.agg[key], pv=prev?prev.agg[key]:null;
    let delta="";
    if(pv!=null){const d=cur-pv;const cls=d>0?"pos":d<0?"neg":"";const ar=d>0?"▲":d<0?"▼":"▬";delta=`<div class="kpi-delta ${cls}">${ar} ${d>0?"+":""}${fmt(d)} vs periode lalu</div>`;}
    else delta=`<div class="kpi-delta" style="color:var(--txt-faint)">snapshot pertama</div>`;
    return `<div class="card kpi"><div class="kpi-top"><div class="kpi-ico">${ico}</div></div><div class="kpi-label">${label}</div><div class="kpi-val">${fmt(cur)}</div>${delta}</div>`;
  }
  c.innerHTML=`
  <div class="hint" style="margin:0 2px 10px">📊 KPI di bawah mencerminkan snapshot terbaru${storeTag?`<b>${storeTag}</b>`:""}, dibandingkan dengan periode sebelumnya dari toko yang sama. Gunakan bagian "Perbandingan Per SKU" &amp; "Daftar Snapshot" untuk lihat semua toko.</div>
  <div class="kpi-grid">
    ${aggKpi("avgRoas",fmtX,"Avg ROAS Aktual","⚡")}
    ${aggKpi("sumProfit",fmtRp,"Total Profit Aktual","💰")}
    ${aggKpi("avgProfitPct",fmtPct,"Avg Profit Aktual %","📈")}
    ${aggKpi("sumMargin",fmtRp,"Total Margin Kotor","📊")}
  </div>
  <div class="section-head"><h3>📈 Tren Mingguan (Agregat)</h3><div class="ln"></div>
    <span style="font-size:12px;color:var(--txt-faint)">${weeks.length} minggu tersimpan</span></div>
  <div class="card chart-card" style="padding:18px"><div class="chart-box tall"><canvas id="wkTrend"></canvas></div></div>

  <div class="section-head"><h3>🔀 Perbandingan Per SKU</h3><div class="ln"></div></div>
  <div class="dt-toolbar">
    <div class="search-box"><span class="ico">🔍</span><input class="input" id="wkSearch" placeholder="Cari SKU / nama..." value="${weeklyUI.q}"></div>
    <select class="select" id="wkMetric" style="width:auto">${Object.keys(W_METRICS).map(k=>`<option value="${k}" ${k===weeklyUI.metric?"selected":""}>${W_METRICS[k].l}</option>`).join("")}</select>
    <select class="select" id="wkStore" style="width:auto"><option value="">Semua Toko</option>${STORES.map(s=>`<option ${s===weeklyUI.store?"selected":""}>${s}</option>`).join("")}</select>
    <label style="display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--txt-dim);cursor:pointer"><input type="checkbox" id="wkChanged" ${weeklyUI.onlyChanged?"checked":""}> Hanya yang berubah</label>
    <label style="display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--teal);cursor:pointer;font-weight:600"><input type="checkbox" id="wkAutoStore" ${weeklyUI.autoStore?"checked":""}> 🔄 Auto per toko (semua toko, abaikan periode)</label>
    <select class="select" id="wkBase" style="width:auto;margin-left:auto" title="Periode pembanding (lama)" ${weeklyUI.autoStore?'disabled':''}></select>
    <span style="font-size:12px;color:var(--txt-faint)">vs</span>
    <select class="select" id="wkComp" style="width:auto" title="Periode ini (baru)" ${weeklyUI.autoStore?'disabled':''}></select>
  </div>
  <div class="hint" style="margin:-4px 2px 10px">🔗 <b>Mode periode:</b> gabung semua toko dalam 1 periode. <b>Mode "Auto per toko":</b> tiap toko dibandingkan snapshot terbaru vs sebelumnya (dari toko itu sendiri) — semua toko yang punya data pasti muncul, tak peduli beda periode.</div>
  <div id="wkTbl"></div>

  <div class="section-head"><h3>🚨 Anomali Terdeteksi</h3></div>
  <div id="wkAnom"></div>

  <div class="section-head"><h3>🗂️ Daftar Snapshot</h3><div class="ln"></div><button class="btn sm ghost" id="wkFixOld" title="Pangkas snapshot lama agar hanya berisi SKU toko pemiliknya">🧹 Rapikan Snapshot Lama</button></div>
  <div id="wkSnapList"></div>`;

  // period selectors (base = older period, comp = newer period) — gabung semua toko
  const periods=periodList();
  const popts=periods.map(p=>{const st=periodStores(p);const tag=st.length?` (${st.length} toko)`:"";return `<option value="${p}">${p}${tag}</option>`;}).join("");
  const baseSel=$("#wkBase"),compSel=$("#wkComp");
  baseSel.innerHTML=popts;compSel.innerHTML=popts;
  // default: comp = periode terbaru, base = periode sebelumnya (bisa diubah & dipertahankan)
  if(!weeklyUI.compPeriod||!periods.includes(weeklyUI.compPeriod)) weeklyUI.compPeriod=periods[periods.length-1]||"";
  if(!weeklyUI.basePeriod||!periods.includes(weeklyUI.basePeriod)) weeklyUI.basePeriod=periods.length>1?periods[periods.length-2]:periods[0]||"";
  baseSel.value=weeklyUI.basePeriod;compSel.value=weeklyUI.compPeriod;

  $("#wkSearch").addEventListener("input",e=>{weeklyUI.q=e.target.value.toLowerCase();drawWeeklyTable();});
  $("#wkMetric").onchange=e=>{weeklyUI.metric=e.target.value;drawWeeklyTrend();drawWeeklyTable();};
  $("#wkStore").onchange=e=>{weeklyUI.store=e.target.value;renderWeekly($("#content"));};
  $("#wkChanged").onchange=e=>{weeklyUI.onlyChanged=e.target.checked;drawWeeklyTable();};
  const wkAuto=$("#wkAutoStore"); if(wkAuto)wkAuto.onchange=e=>{weeklyUI.autoStore=e.target.checked;renderWeekly($("#content"));};
  baseSel.onchange=e=>{weeklyUI.basePeriod=e.target.value;drawWeeklyTable();};
  compSel.onchange=e=>{weeklyUI.compPeriod=e.target.value;drawWeeklyTable();};
  $("#wkExp").onclick=exportWeeklyExcel;
  const fixBtn=$("#wkFixOld"); if(fixBtn)fixBtn.onclick=fixOldSnapshots;

  drawWeeklyTrend();
  drawWeeklyTable();
  drawSnapList();
}
// Pangkas snapshot lama: buang item yang store-nya bukan pemilik snapshot,
// lalu hitung ulang agregat. Snapshot tanpa store (manual/lama) dilewati.
function fixOldSnapshots(){
  const affected=(state.weekly||[]).filter(w=>w.store && (w.items||[]).some(it=>it.store!==w.store));
  if(!affected.length){toast("Semua snapshot sudah rapi ✓","ok");return;}
  confirmDialog("Rapikan Snapshot Lama",
    `${affected.length} snapshot masih berisi SKU toko lain (efek dari versi lama). Pangkas agar tiap snapshot hanya berisi SKU toko pemiliknya? Agregat (Avg ROAS, Profit) akan dihitung ulang.`,
    ()=>{
      affected.forEach(w=>{
        w.items=(w.items||[]).filter(it=>it.store===w.store);
        // recompute agg dari items yang tersisa
        let n=0,sHJ=0,sMar=0,sMpct=0,sRoas=0,cR=0,sProfit=0,sRoi=0,sPpct=0,sTgt=0,cT=0,aman=0,was=0,rugi=0;
        w.items.forEach(it=>{ if(!it.hargaJual)return; n++; sHJ+=it.hargaJual; sMar+=it.margin||0; sMpct+=it.marginPct||0;
          if(isFinite(it.targetRoas)&&it.targetRoas>0){sTgt+=it.targetRoas;cT++;}
          if(it.roas!=null){cR++;sRoas+=it.roas;sProfit+=it.profit||0;sRoi+=it.roi||0;sPpct+=it.profitPct||0;
            if(it.status==="AMAN")aman++;else if(it.status==="WASPADA")was++;else rugi++;} });
        w.agg={avgRoi:cR?sRoi/cR:0,avgProfitPct:cR?sPpct/cR:0,avgRoas:cR?sRoas/cR:0,avgTargetRoas:cT?sTgt/cT:0,sumProfit:sProfit,sumMargin:sMar,avgMargin:n?sMpct/n:0,aman,waspada:was,rugi,n,cntRoas:cR};
      });
      save();refreshCounts();renderWeekly($("#content"));
      toast(`${affected.length} snapshot dirapikan ✓`,"ok");
    });
}
function drawWeeklyTrend(){
  destroyWCharts();
  const tc=txtColor(),gc=gridColor();
  // gabung per periode: satu titik per label, rata-rata ROAS/target, jumlah profit
  // jika toko dipilih, hanya snapshot toko itu yang dihitung
  const periods=periodList();
  const agg=periods.map(p=>{
    let snaps=(state.weekly||[]).filter(w=>w.label===p);
    if(weeklyUI.store) snaps=snaps.filter(w=>(w.store||"")===weeklyUI.store);
    let sRoas=0,cRoas=0,sTgt=0,cTgt=0,sProfit=0;
    snaps.forEach(w=>{
      if(isFinite(w.agg.avgRoas)&&w.agg.cntRoas){sRoas+=w.agg.avgRoas*w.agg.cntRoas;cRoas+=w.agg.cntRoas;}
      if(isFinite(w.agg.avgTargetRoas)&&w.agg.n){sTgt+=w.agg.avgTargetRoas*w.agg.n;cTgt+=w.agg.n;}
      sProfit+=w.agg.sumProfit||0;
    });
    return {label:p, avgRoas:cRoas?sRoas/cRoas:0, avgTgt:cTgt?sTgt/cTgt:0, profit:sProfit, has:snaps.length>0};
  }).filter(a=>a.has);
  const labels=agg.map(a=>a.label);
  wCharts.trend=new Chart($("#wkTrend"),{data:{labels,datasets:[
    {type:"line",label:"Avg ROAS (x)",data:agg.map(a=>+a.avgRoas.toFixed(2)),borderColor:"#a855f7",backgroundColor:"rgba(168,85,247,.12)",tension:.3,yAxisID:"y",fill:true,pointRadius:4},
    {type:"line",label:"Avg Target ROAS (x)",data:agg.map(a=>+a.avgTgt.toFixed(2)),borderColor:"#2dd4bf",backgroundColor:"transparent",borderDash:[5,4],tension:.3,yAxisID:"y",pointRadius:3},
    {type:"bar",label:"Total Profit (Rp)",data:agg.map(a=>Math.round(a.profit)),backgroundColor:"rgba(96,165,250,.5)",yAxisID:"y3",borderRadius:6}
  ]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},
    plugins:{legend:{labels:{color:tc,font:{size:11}}}},
    scales:{
      x:{ticks:{color:tc,font:{size:10}},grid:{color:gc}},
      y:{position:"left",title:{display:true,text:"ROAS (x)",color:tc},ticks:{color:tc},grid:{color:gc}},
      y3:{display:false}
    }}});
}
function drawWeeklyTable(){
  const M=W_METRICS[weeklyUI.metric];
  let bm={}, cm={}, baseLabel, compLabel, coverage="";
  if(weeklyUI.autoStore){
    // MODE AUTO PER TOKO: tiap toko → snapshot terbaru (comp) vs sebelumnya (base) dari toko itu
    baseLabel="Sebelumnya (per toko)"; compLabel="Terbaru (per toko)";
    STORES.forEach(s=>{
      const snaps=(state.weekly||[]).filter(w=>(w.store||"")===s)
        .sort((a,b)=>{const ta=a.perStart?new Date(a.perStart).getTime():a.ts;const tb=b.perStart?new Date(b.perStart).getTime():b.ts;return ta-tb;});
      if(!snaps.length) return;
      const last=snaps[snaps.length-1], prev=snaps.length>1?snaps[snaps.length-2]:null;
      (last.items||[]).forEach(it=>{cm[it.store+"|"+(it.sku||it.nama)]=it;});
      if(prev)(prev.items||[]).forEach(it=>{bm[it.store+"|"+(it.sku||it.nama)]=it;});
    });
    const storesWith=[...new Set(Object.values(cm).map(it=>it.store))].filter(Boolean);
    coverage=`<div class="card" style="padding:11px 15px;margin-bottom:12px;font-size:12px;color:var(--txt-dim)">🔄 <b>Mode Auto per toko</b> — membandingkan snapshot terbaru vs sebelumnya untuk tiap toko. Toko dengan data: ${storesWith.length?storesWith.map(s=>`<span class="chip aman" style="padding:1px 7px">${s}</span>`).join(" "):'<span style="color:var(--txt-faint)">—</span>'}</div>`;
  } else {
    const periods=periodList();
    baseLabel=$("#wkBase")?.value || weeklyUI.basePeriod || (periods.length>1?periods[periods.length-2]:periods[0]);
    compLabel=$("#wkComp")?.value || weeklyUI.compPeriod || periods[periods.length-1];
    if(!compLabel){$("#wkTbl").innerHTML=`<div class="card empty">Belum ada periode untuk dibandingkan.</div>`;return;}
    bm=baseLabel?mergedPeriodMap(baseLabel):{}; cm=mergedPeriodMap(compLabel);
    const storesIn=(map)=>[...new Set(Object.values(map).map(it=>it.store))].filter(Boolean);
    const compStores=storesIn(cm), baseStores=storesIn(bm);
    const allStoresEver=[...new Set((state.weekly||[]).map(w=>w.store).filter(Boolean))];
    const missingComp=allStoresEver.filter(s=>!compStores.includes(s));
    coverage=`<div class="card" style="padding:11px 15px;margin-bottom:12px;font-size:12px;color:var(--txt-dim);line-height:1.7">
      <div>📦 <b>${compLabel}</b> berisi: ${compStores.length?compStores.map(s=>`<span class="chip aman" style="padding:1px 7px">${s}</span>`).join(" "):'<span style="color:var(--txt-faint)">—</span>'}</div>
      <div>📦 <b>${baseLabel||'–'}</b> berisi: ${baseStores.length?baseStores.map(s=>`<span class="chip neutral" style="padding:1px 7px">${s}</span>`).join(" "):'<span style="color:var(--txt-faint)">—</span>'}</div>
      ${missingComp.length?`<div style="margin-top:4px;color:var(--amber)">⚠ Toko belum ada di periode "${compLabel}": <b>${missingComp.join(", ")}</b> — import data toko itu untuk periode ini, atau pakai mode "Auto per toko".</div>`:''}</div>`;
  }
  const base={label:baseLabel}, comp={label:compLabel};
  const keys=new Set([...Object.keys(cm),...Object.keys(bm)]);
  let rows=[...keys].map(k=>{const cur=cm[k],pv=bm[k];return{k,cur,pv,name:(cur||pv).nama,sku:(cur||pv).sku,store:(cur||pv).store};});
  // filters
  if(weeklyUI.store)rows=rows.filter(r=>r.store===weeklyUI.store);
  if(weeklyUI.q)rows=rows.filter(r=>(r.sku||"").toLowerCase().includes(weeklyUI.q)||(r.name||"").toLowerCase().includes(weeklyUI.q));
  const val=(it)=>it?it[weeklyUI.metric]:null;
  if(weeklyUI.onlyChanged)rows=rows.filter(r=>{const a=val(r.cur),b=val(r.pv);return a!=null&&b!=null&&a!==b;});
  // sort by delta desc (biggest movers first), nulls last
  rows.sort((x,y)=>{
    const dx=(val(x.cur)!=null&&val(x.pv)!=null)?val(x.cur)-val(x.pv):(val(x.cur)!=null?1e-9:-1e12);
    const dy=(val(y.cur)!=null&&val(y.pv)!=null)?val(y.cur)-val(y.pv):(val(y.cur)!=null?1e-9:-1e12);
    return Math.abs(dy)-Math.abs(dx);
  });
  let up=0,down=0,flat=0,neu=0;
  rows.forEach(r=>{const a=val(r.cur),b=val(r.pv);if(a==null||b==null){neu++;}else if(a>b)up++;else if(a<b)down++;else flat++;});
  let h=`${coverage}<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr));margin-bottom:12px">
    <div class="card" style="padding:13px 15px"><div class="kpi-label">🟢 Naik</div><div class="kpi-val pos" style="font-size:20px">${up}</div></div>
    <div class="card" style="padding:13px 15px"><div class="kpi-label">🔴 Turun</div><div class="kpi-val neg" style="font-size:20px">${down}</div></div>
    <div class="card" style="padding:13px 15px"><div class="kpi-label">⚪ Tetap</div><div class="kpi-val" style="font-size:20px;color:var(--txt-dim)">${flat}</div></div>
    <div class="card" style="padding:13px 15px"><div class="kpi-label">➖ Tanpa Data</div><div class="kpi-val" style="font-size:20px;color:var(--txt-faint)">${neu}</div></div></div>`;
  h+=`<div class="tbl-wrap"><table class="dt"><thead><tr><th data-tip="Toko asal produk">Toko</th><th data-tip="Kode SKU produk">SKU</th><th style="text-align:right" data-tip="Nilai ${M.l} pada minggu pembanding (lama)">${base?base.label:"–"}</th><th style="text-align:right" data-tip="Nilai ${M.l} pada minggu ini (baru)">${comp.label}</th><th style="text-align:right" data-tip="Selisih ${M.l}: minggu ini − minggu lama">Δ ${M.l}</th><th data-tip="NAIK / TURUN / TETAP / BARU / HILANG">Tren</th></tr></thead><tbody>`;
  if(!rows.length)h+=`<tr><td colspan="6"><div class="empty"><div class="ic">📭</div>Tidak ada data cocok filter.</div></td></tr>`;
  rows.forEach(r=>{
    const a=val(r.cur),b=val(r.pv);
    let deltaCell="–",trend=`<span class="chip neutral">–</span>`;
    if(a!=null&&b!=null){const d=a-b;const cls=d>0?"pos":d<0?"neg":"";const ar=d>0?"▲":d<0?"▼":"▬";
      deltaCell=`<span class="${cls}">${ar} ${d>0?"+":""}${M.fmt(d)}</span>`;
      trend=d>0?`<span class="chip aman">NAIK</span>`:d<0?`<span class="chip rugi">TURUN</span>`:`<span class="chip neutral">TETAP</span>`;}
    else if(a!=null&&b==null){deltaCell=`<span class="chip aman" style="padding:1px 7px">BARU</span>`;trend=`<span class="chip waspada">BARU</span>`;}
    else if(a==null&&b!=null){trend=`<span class="chip rugi">HILANG</span>`;}
    h+=`<tr><td>${r.store}</td><td class="sku">${r.sku||"–"}</td>
      <td class="num">${b!=null?M.fmt(b):"–"}</td><td class="num">${a!=null?M.fmt(a):"–"}</td>
      <td class="num">${deltaCell}</td><td>${trend}</td></tr>`;
  });
  h+=`</tbody></table></div>`;
  $("#wkTbl").innerHTML=h;
}
function drawSnapList(){
  let h=`<div class="tbl-wrap"><table class="dt"><thead><tr><th>Minggu</th><th>Toko</th><th>Tanggal Simpan</th><th>Sumber</th><th style="text-align:right">Produk</th><th style="text-align:right">Avg ROAS</th><th style="text-align:right">Avg Target ROAS</th><th style="text-align:right">Total Profit</th><th></th></tr></thead><tbody>`;
  [...state.weekly].reverse().forEach(w=>{
    const tokoCell = w.store ? `<span class="chip aman" style="font-weight:600">${w.store}</span>` : '<span style="color:var(--txt-faint);font-size:11.5px">semua / lama</span>';
    h+=`<tr><td><b>${w.label}</b></td><td>${tokoCell}</td><td>${dtFmt(w.ts)}</td><td>${w.source==="import"?'<span class="chip neutral">IMPORT</span>':'<span class="chip neutral">MANUAL</span>'}</td>
      <td class="num">${w.agg.n}</td><td class="num">${fmtX(w.agg.avgRoas)}</td><td class="num">${fmtX(w.agg.avgTargetRoas)}</td><td class="num ${w.agg.sumProfit<0?'neg':'pos'}">${fmtRp(w.agg.sumProfit)}</td>
      <td><button class="btn sm danger" data-delsnap="${w.id}" style="padding:4px 8px">🗑</button></td></tr>`;
  });
  h+=`</tbody></table></div>`;
  $("#wkSnapList").innerHTML=h;
  // render anomali lengkap
  const anoms=detectAnomalies();
  const wkAnom=$("#wkAnom");
  if(wkAnom){
    if(!anoms.length){
      wkAnom.innerHTML=`<div class="card empty"><div class="ic">✅</div>Tidak ada anomali terdeteksi. ${state.weekly.length<2?'Simpan minimal 2 snapshot untuk mengaktifkan deteksi tren minggu-ke-minggu.':'Performa stabil.'}</div>`;
    } else {
      const sevCls=a=>a.sev>=2?"neg":"warn", sevIc=a=>a.sev>=2?"🔴":"🟡";
      wkAnom.innerHTML=`<div class="card" style="padding:0;overflow:hidden"><div class="tbl-wrap"><table class="dt"><thead><tr><th>Prioritas</th><th>Toko</th><th>SKU</th><th>Jenis Anomali</th><th>Detail</th></tr></thead><tbody>
      ${anoms.map(a=>`<tr><td><span class="${sevCls(a)}">${sevIc(a)}</span></td><td>${a.store}</td><td class="sku">${a.sku||"–"}</td><td>${a.title}</td><td style="font-size:11.5px;color:var(--txt-dim)">${a.detail}</td></tr>`).join("")}
      </tbody></table></div></div>`;
    }
  }
  $$("#wkSnapList [data-delsnap]").forEach(b=>b.onclick=()=>{const id=b.dataset.delsnap;const w=state.weekly.find(x=>x.id===id);confirmDialog("Hapus Snapshot",`Hapus snapshot <b>${w.label}</b>?`,()=>{state.weekly=state.weekly.filter(x=>x.id!==id);save();refreshCounts();renderWeekly($("#content"));toast("Snapshot dihapus","ok");});});
}
async function exportWeeklyExcel(){
  if(!state.weekly.length){toast("Belum ada snapshot","err");return;}
  const wb=XLSX.utils.book_new();
  // sheet 1: tren agregat
  const tr=[["Minggu","Tanggal","Sumber","Jml Produk","Avg ROAS","Avg Target ROAS","Total Profit","Total Margin","Aman","Waspada","Rugi"]];
  state.weekly.forEach(w=>tr.push([w.label,dtFmt(w.ts),w.source,w.agg.n,+w.agg.avgRoas.toFixed(2),+w.agg.avgTargetRoas.toFixed(2),Math.round(w.agg.sumProfit),Math.round(w.agg.sumMargin),w.agg.aman,w.agg.waspada,w.agg.rugi]));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(tr),"Tren Mingguan");
  // sheet matrix per SKU per snapshot (kolom = periode + toko, agar tak ambigu)
  const buildMatrix=(metric,fmtNum)=>{
    const keys={};state.weekly.forEach(w=>w.items.forEach(it=>{keys[it.store+"|"+(it.sku||it.nama)]={store:it.store,sku:it.sku||it.nama};}));
    const colLabel=w=>w.label+(w.store?` · ${w.store}`:"");
    const head=["Toko","SKU",...state.weekly.map(colLabel)];
    const aoa=[head];
    Object.entries(keys).forEach(([k,meta])=>{
      const row=[meta.store,meta.sku];
      state.weekly.forEach(w=>{const it=w.items.find(x=>(x.store+"|"+(x.sku||x.nama))===k);const v=it?it[metric]:null;row.push(v!=null?fmtNum(v):"");});
      aoa.push(row);
    });
    return XLSX.utils.aoa_to_sheet(aoa);
  };
  XLSX.utils.book_append_sheet(wb,buildMatrix("roas",v=>+v.toFixed(2)),"ROAS per SKU");
  XLSX.utils.book_append_sheet(wb,buildMatrix("profit",v=>Math.round(v)),"Profit per SKU");
  XLSX.utils.book_append_sheet(wb,buildMatrix("margin",v=>Math.round(v)),"Margin per SKU");
  const res=await dl(xlsxBlob(wb),`ROI_Mingguan_${stamp()}.xlsx`);
  if(res!=="cancel")toast(res==="saved"?"Data mingguan tersimpan":"Export mingguan selesai","ok");
}

<script>
/* ============================================================
   VIEW: DAMPAK HARGA — gabung log harga + snapshot ROI
   Untuk tiap SKU yang harganya berubah: tampilkan harga
   sebelum→sesudah, tanggal, dan ROAS/profit dari snapshot
   periode SEBELUM vs SESUDAH tanggal perubahan itu.
   ============================================================ */
const PI_METRICS={
  roas:{label:"ROAS",fmt:fmtX,key:"roas"},
  profit:{label:"Profit/Order",fmt:fmtRp,key:"profit"},
  profitPct:{label:"Profit Aktual %",fmt:v=>(v==null?"–":(v*100).toFixed(1)+"%"),key:"profitPct"}
};
let priceUI={metric:"roas",store:""};
// snapshot yang punya tanggal (perStart) — dipakai untuk mapping before/after.
// _t = awal periode (tengah malam), _tEnd = akhir periode (tengah malam) bila ada.
function datedSnaps(){
  return (state.weekly||[]).filter(w=>w.perStart).map(w=>({
      ...w,
      _t:new Date(w.perStart+"T00:00:00").getTime(),
      _tEnd:w.perEnd?new Date(w.perEnd+"T23:59:59").getTime():new Date(w.perStart+"T23:59:59").getTime()
    }))
    .sort((a,b)=>a._t-b._t);
}
// ambil nilai metric utk SKU tertentu di 1 snapshot
function snapVal(snap,store,sku,metricKey){
  const m=snapMap(snap);
  const it=m[store+"|"+sku] || Object.values(m).find(x=>x.store===store && skuKey(x.sku)===skuKey(sku));
  return it? (it[metricKey]!=null?it[metricKey]:null) : null;
}
// normalisasi timestamp ke awal hari (buang jam) agar perbandingan berbasis TANGGAL saja
function dayStart(t){ const d=new Date(t); d.setHours(0,0,0,0); return d.getTime(); }
// gabungkan history harga jadi daftar perubahan riil per SKU (buang delta 0 & entri "baru masuk")
function priceChanges(){
  return (state.history||[])
    .filter(h=>h.sebelum>0 && h.sesudah>0 && h.sebelum!==h.sesudah && (h.jenis||"Harga Jual")==="Harga Jual")
    .map(h=>({...h, _t:new Date(h.tanggal||h.ts||Date.now()).getTime()}))
    .sort((a,b)=>b._t-a._t);
}
function renderPriceImpact(c){
  const changes=priceChanges();
  const snaps=datedSnaps();
  $("#topActions").innerHTML="";

function paintPriceImpact(){
  const body=$("#piBody"); if(!body)return;
  const M=PI_METRICS[priceUI.metric];
  const snaps=datedSnaps();
  let changes=priceChanges();
  if(priceUI.store) changes=changes.filter(h=>h.toko===priceUI.store);
  // untuk tiap perubahan, cari snapshot sebelum & sesudah tanggalnya
  const rows=changes.map(h=>{
    // utamakan snapshot dari toko yang sama; kalau tak ada, pakai snapshot mana pun
    const sameStore=snaps.filter(s=>(s.store||"")===h.toko);
    const pool=sameStore.length?sameStore:snaps;
    const chgDay=dayStart(h._t); // tanggal perubahan (buang jam)
    // SESUDAH = periode yang MENCAKUP tanggal perubahan (perStart ≤ chg ≤ perEnd),
    //           atau periode paling awal yang mulai SETELAH tanggal perubahan.
    const after = pool.find(s=>dayStart(s._t)<=chgDay && dayStart(s._tEnd)>=chgDay)
               || pool.find(s=>dayStart(s._t) > chgDay)
               || null;
    // SEBELUM = periode terakhir yang BERAKHIR sebelum tanggal perubahan (dan bukan si "after").
    const before = [...pool].reverse().find(s=>dayStart(s._tEnd) < chgDay && s!==after) || null;
    const vB=before?snapVal(before,h.toko,h.sku,M.key):null;
    const vA=after?snapVal(after,h.toko,h.sku,M.key):null;
    return {h,before,after,vB,vA};
  });
  // ringkasan: berapa yang membaik/memburuk (khusus yang punya before&after)
  let better=0,worse=0,flat=0,noData=0;
  rows.forEach(r=>{
    if(r.vB==null||r.vA==null){noData++;return;}
    if(r.vA>r.vB)better++; else if(r.vA<r.vB)worse++; else flat++;
  });
  const priceDir=h=>h.sesudah>h.sebelum?`<span class="mono pos">▲ +${fmtRp(h.sesudah-h.sebelum)}</span>`:`<span class="mono neg">▼ ${fmtRp(h.sesudah-h.sebelum)}</span>`;
  const verdict=(r)=>{
    if(r.vB==null||r.vA==null) return `<span class="chip" style="background:var(--panel);color:var(--txt-faint)">data kurang</span>`;
    const up=r.h.sesudah>r.h.sebelum;
    const d=r.vA-r.vB;
    if(Math.abs(d)<1e-9) return `<span class="chip waspada">stabil</span>`;
    const good=d>0; // metric naik = bagus (roas/profit/roi)
    const label = good?"membaik":"memburuk";
    const cls = good?"aman":"rugi";
    return `<span class="chip ${cls}">${M.label} ${label}</span>`;
  };
  const summary=`
  <div class="kpi-grid" style="margin-bottom:16px">
    <div class="card kpi"><div class="kpi-label">Total Perubahan Harga</div><div class="kpi-val">${changes.length}</div><div class="kpi-delta" style="color:var(--txt-faint)">${priceUI.store||"semua toko"}</div></div>
    <div class="card kpi"><div class="kpi-label">${M.label} Membaik</div><div class="kpi-val pos">${better}</div><div class="kpi-delta pos">setelah harga berubah</div></div>
    <div class="card kpi"><div class="kpi-label">${M.label} Memburuk</div><div class="kpi-val neg">${worse}</div><div class="kpi-delta neg">setelah harga berubah</div></div>
    <div class="card kpi"><div class="kpi-label">Data Belum Lengkap</div><div class="kpi-val">${noData}</div><div class="kpi-delta" style="color:var(--txt-faint)">butuh snapshot before/after</div></div>
  </div>`;
  let h=`${summary}<div class="card" style="padding:0;overflow:hidden"><div class="tbl-wrap"><table class="dt">
    <thead><tr>
      <th>Tanggal</th><th>Toko</th><th>SKU</th>
      <th style="text-align:right">Harga Sebelum→Sesudah</th>
      <th style="text-align:right">${M.label} Sebelum</th>
      <th style="text-align:right">${M.label} Sesudah</th>
      <th style="text-align:right">Δ</th>
      <th>Hasil</th><th>Catatan</th>
    </tr></thead><tbody>`;
  rows.forEach(r=>{
    const tgl=new Date(r.h._t).toLocaleDateString("id-ID",{day:"2-digit",month:"short"});
    const dCell=(r.vB!=null&&r.vA!=null)?(()=>{const d=r.vA-r.vB;const cls=d>0?"pos":d<0?"neg":"";const ar=d>0?"▲":d<0?"▼":"▬";return `<span class="mono ${cls}">${ar} ${d>0?"+":""}${M.fmt(d)}</span>`;})():`<span style="color:var(--txt-faint)">–</span>`;
    h+=`<tr>
      <td class="mono" style="font-size:11.5px">${tgl}</td>
      <td style="font-size:12px">${r.h.toko}</td>
      <td class="sku">${r.h.sku||"–"}</td>
      <td class="num">${fmtRp(r.h.sebelum)} ${priceDir(r.h)}<div style="font-size:11px;color:var(--txt-faint)">→ ${fmtRp(r.h.sesudah)}</div></td>
      <td class="num">${r.vB!=null?M.fmt(r.vB):'<span style="color:var(--txt-faint)">'+(r.before?'–':'no snap')+'</span>'}<div style="font-size:10.5px;color:var(--txt-faint)">${r.before?r.before.label:''}</div></td>
      <td class="num">${r.vA!=null?M.fmt(r.vA):'<span style="color:var(--txt-faint)">'+(r.after?'–':'no snap')+'</span>'}<div style="font-size:10.5px;color:var(--txt-faint)">${r.after?r.after.label:''}</div></td>
      <td class="num">${dCell}</td>
      <td>${verdict(r)}</td>
      <td style="font-size:11.5px;color:var(--txt-dim);max-width:160px">${r.h.catatan||"–"}</td>
    </tr>`;
  });
  h+=`</tbody></table></div></div>
  <p class="hint" style="margin:12px 2px">💡 "Sebelum/Sesudah" diambil dari snapshot ROI mingguan yang berdekatan dengan tanggal perubahan harga. Makin rutin kamu import per periode (dengan tanggal diisi), makin akurat perbandingannya.</p>`;
  body.innerHTML=h;
}
</script>
<script>

  {k:"sku",l:"SKU ID *",req:1},{k:"nama",l:"Nama Produk"},{k:"hpp",l:"HPP (Rp)"},

];

// buat label periode ringkas dari 2 tanggal, mis "15–21 Jun" atau "29 Jun–5 Jul"
function periodLabel(startStr,endStr){
  if(!startStr||!endStr) return null;
  const s=new Date(startStr+"T00:00:00"), e=new Date(endStr+"T00:00:00");
  if(isNaN(s)||isNaN(e)) return null;
  const mo=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
  const sd=s.getDate(),ed=e.getDate(),sm=mo[s.getMonth()],em=mo[e.getMonth()];
  const sy=s.getFullYear(),ey=e.getFullYear();
  if(sy===ey && sm===em) return `${sd}–${ed} ${em}`;
  if(sy===ey) return `${sd} ${sm}–${ed} ${em}`;
  return `${sd} ${sm} ${String(sy).slice(2)}–${ed} ${em} ${String(ey).slice(2)}`;
}
function renderImport(c){
  c.innerHTML=`<div class="card" style="padding:22px">

    </div>

    </div>

    <div style="margin-top:12px;padding:12px 15px;background:var(--grad-soft);border:1px solid var(--stroke);border-radius:var(--r-sm);font-size:12.3px;color:var(--txt-dim);display:flex;gap:9px;align-items:flex-start"><span>💡</span><span><b>Alur mingguan:</b> pilih toko → drop file "Product campaign data" TikTok Shop → sistem cocokkan kolom <b>Nama kampanye</b> ke SKU dan update <b>ROAS Aktual</b> di Multi ROAS toko itu, sekaligus simpan snapshot ROI minggu ini.</span></div>

// detect TikTok Shop "Product campaign data" export by its headers
function detectCampaign(headers){
  const low=headers.map(h=>h.toLowerCase());
  const has=(...cands)=>low.findIndex(h=>cands.some(c=>h.includes(c)));
  const iSku=has("nama kampanye","campaign name");
  const iRoi=low.findIndex(h=>h==="roi"||h.includes("roi")&&!h.includes("perlindungan"));
  const iRoiExact=low.findIndex(h=>h==="roi");
  const roiIdx=iRoiExact>=0?iRoiExact:iRoi;
  if(iSku>=0 && roiIdx>=0){
    return {sku:iSku, roi:roiIdx,
      cost:has("biaya bersih","biaya"), orders:has("pesanan sku","pesanan"),
      revenue:has("pendapatan kotor","pendapatan"), cpa:has("biaya per pesanan"),
      productId:has("product id","id produk"),
      campaign:has("id campaign","campaign id")};
  }
  return null;
}
function handleImportFile(file){
  const rd=new FileReader();
  rd.onload=e=>{
    try{
      let wb;
      if(file.name.toLowerCase().endsWith(".csv")){wb=XLSX.read(e.target.result,{type:"string"});}
      else {wb=XLSX.read(new Uint8Array(e.target.result),{type:"array"});}
      const sheet=wb.Sheets[wb.SheetNames[0]];
      const arr=XLSX.utils.sheet_to_json(sheet,{header:1,defval:""});
      let hIdx=0;for(let i=0;i<Math.min(arr.length,15);i++){const nonEmpty=arr[i].filter(x=>x!=="").length;if(nonEmpty>=3){hIdx=i;break;}}
      const headers=arr[hIdx].map(x=>String(x).trim());
      const dataRows=arr.slice(hIdx+1).filter(r=>r.some(x=>x!==""));
      importCtx={headers,dataRows,fileName:file.name};
      const mode=($("#impMode")&&$("#impMode").value)||"merge";
      if(mode==="hpp"){ buildHppUpdateUI(); return; }
      const varn=detectVariant(headers);
      const camp=detectCampaign(headers);
      if(varn){ importCtx.variant=varn; buildVariantUI(); }
      else if(camp){ importCtx.campaign=camp; buildCampaignUI(); }
      else buildMapUI();
    }catch(err){toast("Gagal baca file: "+err.message,"err");}
  };
  if(file.name.toLowerCase().endsWith(".csv"))rd.readAsText(file);else rd.readAsArrayBuffer(file);
}
// detect TikTok Shop product/variant export (Product ID + Parent SKU + Seller SKU + HPP)
function detectVariant(headers){
  const low=headers.map(h=>h.toLowerCase().trim());
  // exact-match dulu (hindari "sku" nyangkut ke "sku id"), baru fallback contains
  const exact=(...c)=>low.findIndex(h=>c.some(x=>h===x));
  const contains=(...c)=>low.findIndex(h=>c.some(x=>h.includes(x)));
  const pick=(exacts,conts)=>{const e=exact(...exacts);return e>=0?e:contains(...conts);};
  const iPid=pick(["product id","id produk"],["product id","id produk"]);
  const iParent=pick(["parent sku","sku induk"],["parent sku","sku induk"]);
  const iSeller=pick(["seller sku","sku penjual","seller"],["seller sku","sku penjual"]);
  const iSkuId=pick(["sku id"],["sku id"]);
  const iVar=pick(["variasi","variation","variant"],["variasi","variation","variant"]);
  const iHpp=pick(["hpp","harga pokok","cost"],["hpp","harga pokok"]);
  if(iPid>=0 && iParent>=0 && iSeller>=0 && iHpp>=0){
    return {pid:iPid,parent:iParent,seller:iSeller,variasi:iVar,hpp:iHpp,
      skuId:iSkuId,
      hNormal:pick(["harga normal","harga jual"],["harga normal","harga jual"]),
      hPromo:pick(["harga promo","harga diskon"],["harga promo","harga diskon"]),
      stok:pick(["stok","stock","sisa stok"],["stok","stock"]),
      po:pick(["po","pre order","preorder"],["pre order","preorder"])};
  }
  return null;
}
// tolerant SKU key: uppercase, strip spaces & dashes
function skuKey(s){ return String(s||"").toUpperCase().replace(/[\s\-_]/g,""); }

/* ============================================================
   IMPORT KHUSUS UPDATE HPP — hanya perbarui HPP parent & varian
   File cukup: kolom SKU (Seller SKU / SKU ID / Parent SKU) + kolom HPP
   ============================================================ */
function detectHpp(headers){
  const low=headers.map(h=>h.toLowerCase().trim());
  const exact=(...c)=>low.findIndex(h=>c.some(x=>h===x));
  const contains=(...c)=>low.findIndex(h=>c.some(x=>h.includes(x)));
  const pick=(ex,co)=>{const e=exact(...ex);return e>=0?e:contains(...co);};
  const iHpp=pick(["hpp","harga pokok","cost","modal"],["hpp","harga pokok","modal"]);
  // kolom SKU: utamakan Seller SKU, lalu SKU ID, lalu Parent SKU, lalu "sku"
  const iSeller=pick(["seller sku","sku penjual","seller"],["seller sku","sku penjual"]);
  const iSkuId=pick(["sku id"],["sku id"]);
  const iParent=pick(["parent sku","sku induk"],["parent sku","sku induk"]);
  const iSku=pick(["sku","kode"],["sku","kode"]);
  const iProdId=pick(["product id","id produk"],["product id","id produk"]);
  const iNormal=pick(["harga normal","harga jual","harga"],["harga normal","harga jual"]);
  const iPromo=pick(["harga promo","harga diskon"],["harga promo","harga diskon"]);
  return {hpp:iHpp,seller:iSeller,skuId:iSkuId,parent:iParent,sku:iSku,prodId:iProdId,hNormal:iNormal,hPromo:iPromo};
}
function buildHppUpdateUI(){
  const {headers,dataRows,fileName}=importCtx;
  const store=$("#impStore").value;
  const hm=detectHpp(headers);
  const area=$("#mapArea");
  const hasCol=(hm.hpp>=0)||(hm.hPromo>=0)||(hm.hNormal>=0);
  if(!hasCol){
    area.innerHTML=`<div class="card" style="padding:20px;margin-top:16px;border-left:3px solid var(--red)">
      <b style="font-size:14px">❌ Kolom HPP / Harga Jual tidak ditemukan</b>
      <div class="hint" style="margin-top:8px">File harus punya kolom <b>HPP</b> dan/atau <b>Harga Jual</b> (Harga Normal / Harga Promo), plus salah satu kolom SKU varian (Seller SKU / SKU ID). Kolom terbaca: ${headers.map(h=>`<code>${h}</code>`).join(", ")}</div>
      <button class="btn ghost" id="hppCancel" style="margin-top:12px">Batal</button></div>`;
    $("#hppCancel").onclick=()=>{importCtx=null;area.innerHTML="";};
    return;
  }
  // bangun index parent & varian di toko
  const list=state.stores[store]||[];
  const idxProd={}, idxSku={}, idxVar={};
  list.forEach(r=>{
    if(r.productId) idxProd[String(r.productId).trim()]=r;
    if(r.sku) idxSku[skuKey(r.sku)]=r;
    (r.variants||[]).forEach(v=>{
      if(v.sku) idxVar[skuKey(v.sku)]={parent:r,v};
      if(v.skuId) idxVar[skuKey(v.skuId)]={parent:r,v};
    });
  });
  // parse & cocokkan (HPP dan/atau Harga Jual)
  const rows=dataRows.map(row=>{
    const hpp=(hm.hpp>=0)?pNum(row[hm.hpp]):null;
    const promo=(hm.hPromo>=0)?pNum(row[hm.hPromo]):null;
    const normal=(hm.hNormal>=0)?pNum(row[hm.hNormal]):null;
    const harga=(promo!=null&&promo>0)?promo:normal; // utamakan harga promo
    const keys=[hm.seller,hm.skuId,hm.parent,hm.sku,hm.prodId].filter(i=>i>=0).map(i=>String(row[i]||"").trim()).filter(Boolean);
    return {hpp,harga,keys};
  }).filter(x=>(x.hpp!=null||x.harga!=null) && x.keys.length);
  let matchV=0, nomatch=0;
  const plan=[]; // {ref:{parent,v}, oldHpp, newHpp, oldHarga, newHarga, label, parentSku}
  rows.forEach(({hpp,harga,keys})=>{
    let hit=null;
    for(const k of keys){ if(idxVar[skuKey(k)]){ hit=idxVar[skuKey(k)]; break; } }
    if(!hit){ nomatch++; return; }
    matchV++;
    plan.push({ref:hit,
      oldHpp:hit.v.hpp, newHpp:(hpp!=null?hpp:hit.v.hpp),
      oldHarga:hit.v.hargaJual, newHarga:(harga!=null?harga:hit.v.hargaJual),
      hasHpp:hpp!=null, hasHarga:harga!=null,
      label:hit.v.sku||hit.v.skuId||hit.v.variasi, parentSku:hit.parent.sku});
  });

function commitHppUpdate(){
  const {plan,store}=importCtx.hppPlan;
  let upV=0;
  const parents=new Set();
  plan.forEach(p=>{
    const oldH=+p.ref.v.hpp||0, newH=+p.newHpp||0;
    const oldP=+p.ref.v.hargaJual||0, newP=+p.newHarga||0;
    let touched=false;
    if(p.hasHpp && oldH!==newH){
      logPriceChange(store,{sku:p.ref.v.sku||p.ref.v.skuId,nama:(p.ref.parent.sku||"")+" / "+(p.ref.v.variasi||p.ref.v.sku||"")},oldH,newH,"Update HPP varian dari import","HPP");
      p.ref.v.hpp=newH; touched=true;
    }
    if(p.hasHarga && oldP!==newP){
      logPriceChange(store,{sku:p.ref.v.sku||p.ref.v.skuId,nama:(p.ref.parent.sku||"")+" / "+(p.ref.v.variasi||p.ref.v.sku||"")},oldP,newP,"Update harga jual varian dari import","Harga Jual");
      p.ref.v.hargaJual=newP; touched=true;
    }
    if(touched) upV++;
    // selalu tandai parent utk re-sync (biar HPP parent yg terlanjur salah ikut dibetulkan)
    parents.add(p.ref.parent);
  });
  // HPP & Harga Jual parent otomatis dari varian (dgn history bila berubah)
  parents.forEach(parent=>{ syncParentFromVariants(store,parent,"Auto-sync dari import varian"); });
  save();refreshCounts();
  importCtx=null;$("#mapArea").innerHTML="";
  toast(`${upV} varian diperbarui, ${parents.size} parent disetel ulang → ${store}`,"ok");
  nav("store",store);
}

function doCampaignCommit(){
  const store=$("#impStore").value;
  const addNew=$("#campAddNew")?.checked;
  const inclZero=$("#campZero")?.checked;
  const parsed=importCtx.campParsed||[];
  const idx={}; state.stores[store].forEach(r=>{ if(r.sku){ idx[skuKey(r.sku)]=r; } });
  let upd=0,add=0,skip=0;
  const archivedHits=[]; // {row, roas, campId}
  parsed.forEach(o=>{
    if(o.roas==null){skip++;return;}
    if(o.roas===0 && !inclZero){skip++;return;}
    const ex=idx[skuKey(o.sku)];
    if(ex){
      if(ex.archived){ archivedHits.push({row:ex,roas:o.roas,campId:o.campId,cost:o.cost,revenue:o.revenue,orders:o.orders,productId:o.productId}); return; } // tunda, minta konfirmasi
      if(o.cost!=null)ex.spend=o.cost; if(o.revenue!=null)ex.gmv=o.revenue; if(o.orders!=null)ex.orders=o.orders; if(o.productId)ex.productId=o.productId;
      ex.roasAktual=(o.roas==null && o.revenue>0 && o.cost>0)? +(o.revenue/o.cost).toFixed(2) : o.roas;
      ex.updatedAt=Date.now(); if(o.campId)ex.campId=o.campId; upd++;
    }
    else if(addNew){
      const nr=newRow({nama:store,sku:o.sku,roasAktual:o.roas,spend:o.cost,gmv:o.revenue,orders:o.orders,productId:o.productId||""});
      if(o.campId)nr.campId=o.campId;
      state.stores[store].push(nr); idx[skuKey(o.sku)]=nr; add++;
    } else skip++;
  });
  save();refreshCounts();
  if(archivedHits.length){
    // simpan konteks & tampilkan modal keputusan sebelum finalize
    promptArchivedReactivation(store,archivedHits,{upd,add,skip});
  } else {
    finalizeCampaignImport(store,upd,add,skip);
  }
}

function autoGuess(field,headers){
  const map={sku:["sku","seller sku","kode variasi","kode"],productId:["product id","id produk","product_id"],nama:["nama","product name","produk","name","nama produk"],hpp:["hpp","cost","modal","harga pokok"],hargaJual:["harga jual","harga","price","selling"],diskon:["diskon","discount","voucher"],spend:["spend","biaya iklan","ad spend","cost iklan","total biaya","biaya"],gmv:["gmv","gross revenue","pendapatan","revenue","omzet","total penjualan"],orders:["orders","order","pesanan","jumlah pesanan","transaksi","qty terjual"],komPlat:["komisi platform","platform"],komDin:["komisi dinamis","dinamis","dynamic"],growth:["growth"],affil:["affil","affiliate","creator"],ops:["operasional","ops"],roasAktual:["roas"],proses:["proses","processing","pemrosesan"],logistik:["logistik","ongkir","shipping","logistic"],packing:["packing","kemasan"]};
  const cand=map[field.k]||[field.k];
  const idx=headers.findIndex(h=>cand.some(c=>h.toLowerCase().includes(c)));

function commitVariants(){
  const {byPid,store}=importCtx.variantParsed;
  const list=state.stores[store]||[];
  const byProdId={}, bySku={};
  list.forEach(r=>{ if(r.productId)byProdId[String(r.productId).trim()]=r; if(r.sku)bySku[skuKey(r.sku)]=r; });
  // simpan varian yg belum ketemu parent-nya ke penampung global (per toko)
  state.variantPool=state.variantPool||{};
  state.variantPool[store]=state.variantPool[store]||{};
  let attached=0, pooled=0, totVar=0;
  Object.entries(byPid).forEach(([pid,vars])=>{
    totVar+=vars.length;
    const parentSku=vars[0].parentSku;
    const parent=byProdId[pid] || bySku[skuKey(parentSku)];
    const clean=vars.map(v=>({sku:v.seller,skuId:v.skuId,variasi:v.variasi,hpp:v.hpp,hargaJual:v.hargaJual,hargaNormal:v.hargaNormal,stok:v.stok,po:v.po,parentSku:v.parentSku,productId:v.productId}));
    if(parent){ parent.variants=clean; parent.updatedAt=Date.now(); syncParentFromVariants(store,parent,"Auto-sync saat import varian"); attached++; }
    else { state.variantPool[store][pid]={parentSku,variants:clean}; pooled++; }
  });
  save();refreshCounts();
  importCtx=null;$("#mapArea").innerHTML="";
  toast(`${totVar} varian tersimpan: ${attached} parent langsung dapat varian`+(pooled?`, ${pooled} menunggu parent`:""),"ok");
  nav("store",store);
}
// pasang varian yg tadinya "menunggu parent" ke parent yg baru muncul di toko
function attachPooledVariants(store){
  if(!state.variantPool||!state.variantPool[store])return 0;
  const list=state.stores[store]||[]; let done=0;
  const byProdId={}, bySku={};
  list.forEach(r=>{ if(r.productId)byProdId[String(r.productId).trim()]=r; if(r.sku)bySku[skuKey(r.sku)]=r; });
  Object.entries(state.variantPool[store]).forEach(([pid,entry])=>{
    const parent=byProdId[pid]||bySku[skuKey(entry.parentSku)];
    if(parent){ parent.variants=entry.variants; parent.updatedAt=Date.now(); syncParentFromVariants(store,parent,"Auto-sync saat varian menempel ke parent"); delete state.variantPool[store][pid]; done++; }
  });
  return done;
}

  IMPORT_FIELDS.forEach(f=>{

}
function readMapping(){const m={};$$("#mapArea [data-field]").forEach(s=>{if(s.value!=="")m[s.dataset.field]=+s.value;});return m;}
function doImportPreview(){
  const map=readMapping();
  if(map.sku==null&&map.hargaJual==null){toast("Minimal petakan SKU atau Harga Jual","err");return;}
  state.mapping=map;save();
  const {dataRows}=importCtx;
  const parsed=dataRows.map(row=>{
    const o={};IMPORT_FIELDS.forEach(f=>{
      if(map[f.k]==null)return;const raw=row[map[f.k]];
      if(f.k==="nama"||f.k==="sku")o[f.k]=String(raw).trim();
      else if(["komPlat","komDin","growth","affil","ops"].includes(f.k))o[f.k]=pPct(raw);
      else if(f.k==="roasAktual")o[f.k]=pNum(raw);
      else o[f.k]=pNum(raw);
    });return o;
  }).filter(o=>o.sku||o.hargaJual);
  const store=$("#impStore").value; let mode=$("#impMode").value; if(mode==="hpp")mode="merge";
  // simulate merge
  const existing=state.stores[store];const bySku={};existing.forEach(r=>{if(r.sku)bySku[r.sku.toLowerCase()]=r;});
  let upd=0,add=0,priceChg=0;
  parsed.forEach(o=>{const ex=o.sku?bySku[o.sku.toLowerCase()]:null;if(ex&&mode!=="append"){upd++;if(o.hargaJual!=null&&o.hargaJual!==ex.hargaJual)priceChg++;}else add++;});
  let h=`<div class="section-head"><h3>📋 Preview Import</h3></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px">
    <div class="card" style="padding:15px"><div class="kpi-label">Baris Valid</div><div class="kpi-val">${parsed.length}</div></div>
    <div class="card" style="padding:15px"><div class="kpi-label">Update</div><div class="kpi-val warn">${mode==="append"?0:upd}</div></div>
    <div class="card" style="padding:15px"><div class="kpi-label">Baru</div><div class="kpi-val pos">${add}</div></div>
    <div class="card" style="padding:15px"><div class="kpi-label">Harga Berubah</div><div class="kpi-val">${priceChg}</div></div></div>
    <div class="tbl-wrap" style="max-height:340px"><table class="dt"><thead><tr><th>SKU</th><th>Nama</th><th style="text-align:right">HPP</th><th style="text-align:right">Harga Jual</th><th style="text-align:right">ROAS</th><th>Aksi</th></tr></thead><tbody>`;
  parsed.slice(0,50).forEach(o=>{const ex=o.sku?bySku[o.sku.toLowerCase()]:null;const act=ex&&mode!=="append"?`<span class="chip waspada">UPDATE</span>`:`<span class="chip aman">BARU</span>`;
    h+=`<tr><td class="sku">${o.sku||"–"}</td><td>${o.nama||"–"}</td><td class="num">${o.hpp!=null?fmtRp(o.hpp):"–"}</td><td class="num">${o.hargaJual!=null?fmtRp(o.hargaJual):"–"}</td><td class="num">${o.roasAktual!=null?fmtX(o.roasAktual):"–"}</td><td>${act}</td></tr>`;});
  h+=`</tbody></table></div><p class="hint" style="margin:10px 2px">${parsed.length>50?`Menampilkan 50 dari ${parsed.length} baris. `:""}Mode: <b>${mode}</b> → ${store}</p>
  <div class="modal-foot" style="justify-content:flex-start"><button class="btn primary" id="impConfirm">✅ Konfirmasi Import</button></div>`;

}
function doImportCommit(parsed,store,mode){
  if(mode==="replace")state.stores[store]=[];
  const bySku={};state.stores[store].forEach(r=>{if(r.sku)bySku[r.sku.toLowerCase()]=r;});
  let upd=0,add=0;
  parsed.forEach(o=>{
    const ex=o.sku?bySku[o.sku.toLowerCase()]:null;
    if(ex&&mode==="merge"){
      if(o.hargaJual!=null&&o.hargaJual!==ex.hargaJual){logPriceChange(store,ex,ex.hargaJual,o.hargaJual,"Update dari import Excel");}
      Object.keys(o).forEach(k=>{if(o[k]!=null&&o[k]!=="")ex[k]=o[k];});ex.updatedAt=Date.now();upd++;
    } else {
      const nr=newRow({nama:o.nama||store,sku:o.sku||"IMP-"+uid()});
      Object.keys(o).forEach(k=>{if(o[k]!=null&&o[k]!=="")nr[k]=o[k];});
      // log new entry
      if(nr.hargaJual)logPriceChange(store,nr,0,nr.hargaJual,"Baru masuk dari import Excel");
      state.stores[store].push(nr);if(nr.sku)bySku[nr.sku.toLowerCase()]=nr;add++;
    }
  });
  save();refreshCounts();importCtx=null;$("#mapArea").innerHTML="";
  impLastStore=store;
  attachPooledVariants(store);
  // auto snapshot berlabel periode data (bukan tanggal klik) → periode berbeda tak saling menimpa
  const plabel=periodLabel(impPeriod.start,impPeriod.end);
  const {replaced}=takeSnapshot("import",plabel);
  const lblTxt=plabel?`"${plabel}"`:"minggu ini";
  toast(`Import selesai: ${upd} update, ${add} baru → ${store}`,"ok");
  toast(replaced?`Snapshot ROI ${lblTxt} diperbarui`:`Snapshot ROI ${lblTxt} tersimpan`,"info");
  if(!plabel) toast("Tip: isi Periode Data di layar import agar snapshot tidak saling menimpa","info");
  nav("store",store);
}
</script>

// Simpan blob. Jika browser mendukung File System Access API → buka dialog "Save As"
// (user bisa pilih folder/storage). Jika tidak → unduh biasa ke folder Download.
async function dl(blob,name){
  const ext=(name.split(".").pop()||"").toLowerCase();
  const typeMap={json:{d:"File JSON",m:{"application/json":[".json"]}},xlsx:{d:"File Excel",m:{"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":[".xlsx"]}},csv:{d:"File CSV",m:{"text/csv":[".csv"]}}};
  if(window.showSaveFilePicker){
    try{
      const opts={suggestedName:name};
      if(typeMap[ext]) opts.types=[{description:typeMap[ext].d,accept:typeMap[ext].m}];
      const handle=await window.showSaveFilePicker(opts);
      const w=await handle.createWritable();
      await w.write(blob); await w.close();
      return "saved";
    }catch(err){
      if(err&&err.name==="AbortError") return "cancel"; // user batal pilih lokasi
      // selain batal → fallback ke unduh biasa
    }
  }
  const u=URL.createObjectURL(blob);const a=el("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);
  return "download";
}
const stamp=()=>new Date().toISOString().slice(0,10);

  STORES.forEach(s=>{const ws=XLSX.utils.aoa_to_sheet(storeToAOA(s));ws["!cols"]=Array(26).fill({wch:13});XLSX.utils.book_append_sheet(wb,ws,s.slice(0,31));});
  // history
  const hh=[["Tanggal","Toko","SKU","Nama","Jenis","Harga Sebelum","Harga Sesudah","Selisih","Arah","Catatan"]];
  state.history.forEach(x=>hh.push([dtFmt(x.ts),x.toko,x.sku,x.nama,x.jenis||"Harga Jual",x.sebelum,x.sesudah,x.delta,x.delta>0?"NAIK":x.delta<0?"TURUN":"SAMA",x.catatan]));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(hh),"History Harga");
  // varian rugi (bocor tersembunyi)
  const lv=collectLosingVariants(null);
  if(lv.length){
    const lvAoa=[["Toko","Parent SKU","Product ID","Status Parent","Tersembunyi?","SKU ID Varian","Seller SKU","Variasi","ROAS (warisan)","HPP","Harga","Margin Kotor","Profit Aktual","Profit %","Saran Harga 10%","Selisih","Stok"]];
    lv.forEach(({store,parent,parentStatus,v,vc,hidden})=>{
      lvAoa.push([store,parent.sku||"",parent.productId||"",parentStatus,hidden?"YA":"",v.skuId||"",v.sku||"",v.variasi||"",
        parent.roasAktual!=null?+(+parent.roasAktual).toFixed(2):"",
        v.hpp!=null?v.hpp:parent.hpp, v.hargaJual!=null?v.hargaJual:"",
        Math.round(vc.marginKotor), vc.profitAkt!=null?Math.round(vc.profitAkt):"",
        vc.profitAktPct!=null?+(vc.profitAktPct*100).toFixed(1):"",
        typeof vc.saranHarga==="number"?Math.round(vc.saranHarga):vc.saranHarga,
        typeof vc.selisih==="number"?Math.round(vc.selisih):"", v.stok!=null?v.stok:""]);
    });
    const lvWs=XLSX.utils.aoa_to_sheet(lvAoa);lvWs["!cols"]=Array(17).fill({wch:14});
    XLSX.utils.book_append_sheet(wb,lvWs,"Varian Rugi");
  }
  const res=await dl(xlsxBlob(wb),`ROAS_Command_${stamp()}.xlsx`);
  if(res!=="cancel")toast(res==="saved"?"Excel tersimpan ke lokasi pilihanmu":"Excel multi-sheet diunduh","ok");
}
async function exportStoreExcel(s){
  const wb=XLSX.utils.book_new();const ws=XLSX.utils.aoa_to_sheet(storeToAOA(s));ws["!cols"]=Array(26).fill({wch:13});
  XLSX.utils.book_append_sheet(wb,ws,s.slice(0,31));
  const res=await dl(xlsxBlob(wb),`${s.replace(/ /g,"_")}_${stamp()}.xlsx`);
  if(res!=="cancel")toast(res==="saved"?`Export ${s} tersimpan`:`Export ${s} selesai`,"ok");
}

async function exportAllCSV(){
  const rows=[["Toko","SKU","HPP","Harga Jual","Harga Final","Margin Profit","Margin Profit %","Margin Kotor","Margin Kotor %","Target ROAS","ROAS BEP","ROAS Aktual","Profit Aktual","Profit Aktual %","Status"]];
  allRows().forEach(r=>{const c=calcRow(r);rows.push([r._store,r.sku,r.hpp,r.hargaJual,Math.round(c.hargaFinal),Math.round(c.marginProfit),+(c.marginProfitPct*100).toFixed(1),Math.round(c.marginKotor),+(c.marginKotorPct*100).toFixed(1),+c.targetRoasIdeal.toFixed(2),+c.roasBEP.toFixed(2),c.roasAkt??"",c.profitAkt!=null?Math.round(c.profitAkt):"",c.profitAktPct!=null?+(c.profitAktPct*100).toFixed(1):"",c.status]);});
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const res=await dl(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}),`roas_export_${stamp()}.csv`);
  if(res!=="cancel")toast(res==="saved"?"CSV tersimpan ke lokasi pilihanmu":"CSV diunduh","ok");
}

/* ============================================================
   THEME + BOOT
   ============================================================ */
function applyTheme(){
  const dark=state.settings.theme==="dark";
  document.body.setAttribute("data-theme",dark?"dark":"light");
  const ico=$("#themeIco"),lbl=$("#themeLbl");if(ico){ico.textContent=dark?"🌙":"☀️";lbl.textContent=dark?"Dark":"Light";}
  if(current.view==="analytics")setTimeout(drawCharts,60);
}
function boot(){
  initState();
  if(state.settings.defaults)Object.assign(DEFAULTS,state.settings.defaults);
  applyTheme();refreshCounts();
  $$(".nav-item").forEach(n=>n.onclick=()=>nav(n.dataset.view,n.dataset.store));
  $("#themeBtn").onclick=()=>{state.settings.theme=state.settings.theme==="dark"?"light":"dark";save();applyTheme();};
  $("#menuToggle").onclick=()=>$("#sidebar").classList.toggle("open");
  nav("dashboard");
}
document.addEventListener("DOMContentLoaded",boot);
</script>
