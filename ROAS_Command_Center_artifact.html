<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROAS Command Center — TikTok Shop</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0a0e1a; --bg2:#0e1424; --panel:rgba(20,27,45,0.72); --panel-solid:#141b2d;
  --stroke:rgba(120,140,190,0.14); --stroke-hi:rgba(120,140,190,0.28);
  --txt:#e8edf7; --txt-dim:#9aa6c4; --txt-faint:#5f6b8a;
  --teal:#2dd4bf; --teal-dim:#0f766e; --violet:#8b5cf6; --violet-dim:#5b21b6;
  --grad:linear-gradient(135deg,#2dd4bf 0%,#6366f1 55%,#a855f7 100%);
  --grad-soft:linear-gradient(135deg,rgba(45,212,191,.14),rgba(168,85,247,.14));
  --green:#34d399; --amber:#fbbf24; --red:#f87171; --blue:#60a5fa;
  --shadow:0 12px 40px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:10px;
  --mono:'JetBrains Mono','SF Mono',ui-monospace,Menlo,monospace;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
[data-theme="light"]{
  --bg:#f4f6fb; --bg2:#eef1f8; --panel:rgba(255,255,255,0.78); --panel-solid:#ffffff;
  --stroke:rgba(30,50,90,0.10); --stroke-hi:rgba(30,50,90,0.20);
  --txt:#0f1830; --txt-dim:#4a5578; --txt-faint:#8b96b5;
  --shadow:0 12px 40px -16px rgba(30,50,120,.25);
}
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans); background:var(--bg); color:var(--txt);
  font-size:14px; line-height:1.5; overflow:hidden;
  background-image:radial-gradient(1200px 600px at 12% -8%,rgba(45,212,191,.10),transparent 60%),radial-gradient(1000px 500px at 105% 8%,rgba(168,85,247,.10),transparent 55%);
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--stroke-hi);border-radius:20px}
::-webkit-scrollbar-track{background:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit}
a{color:var(--teal);text-decoration:none}

/* ---------- LAYOUT ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);height:100vh}
.sidebar{
  background:linear-gradient(180deg,rgba(14,20,36,.9),rgba(10,14,26,.95));
  border-right:1px solid var(--stroke); display:flex;flex-direction:column;
  backdrop-filter:blur(14px); z-index:20;
}
[data-theme="light"] .sidebar{background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(238,241,248,.95))}
.brand{padding:20px 18px 16px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--stroke)}
.brand-logo{width:38px;height:38px;border-radius:11px;background:var(--grad);display:grid;place-items:center;font-weight:800;font-size:17px;color:#04121a;box-shadow:0 6px 18px -6px rgba(99,102,241,.6);flex-shrink:0}
.brand-txt h1{font-size:14.5px;font-weight:800;letter-spacing:-.3px;line-height:1.1}
.brand-txt span{font-size:10.5px;color:var(--txt-faint);font-family:var(--mono);letter-spacing:.5px}
.nav{flex:1;overflow-y:auto;padding:14px 12px}
.nav-label{font-size:10px;font-weight:700;color:var(--txt-faint);text-transform:uppercase;letter-spacing:1.2px;padding:12px 12px 7px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9.5px 12px;border-radius:var(--r-sm);color:var(--txt-dim);font-weight:500;font-size:13.3px;transition:.16s;position:relative;width:100%;text-align:left}
.nav-item:hover{background:var(--panel);color:var(--txt)}
.nav-item.active{background:var(--grad-soft);color:var(--txt);font-weight:600}
.nav-item.active::before{content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:3.5px;height:20px;background:var(--grad);border-radius:0 4px 4px 0}
.nav-item .ico{width:18px;text-align:center;font-size:15px;flex-shrink:0}
.nav-item.sub{padding-left:40px;font-size:12.6px}
.nav-item .badge{margin-left:auto;font-size:10px;font-family:var(--mono);background:var(--panel-solid);border:1px solid var(--stroke);padding:1px 7px;border-radius:20px;color:var(--txt-dim)}
.spinner{width:34px;height:34px;border:3px solid var(--stroke);border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-md li{list-style:disc}
.ai-md h3,.ai-md h4{color:var(--teal)}
.side-foot{padding:12px;border-top:1px solid var(--stroke);display:flex;gap:8px;align-items:center}
.theme-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:8px;border-radius:var(--r-sm);background:var(--panel);border:1px solid var(--stroke);font-size:12px;color:var(--txt-dim);transition:.15s}
.theme-btn:hover{color:var(--txt);border-color:var(--stroke-hi)}

.main{overflow-y:auto;overflow-x:auto;position:relative;min-width:0}
.topbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:16px;padding:16px 26px;background:linear-gradient(180deg,var(--bg) 60%,transparent);backdrop-filter:blur(6px)}
.page-title{font-size:20px;font-weight:800;letter-spacing:-.5px}
.page-sub{font-size:12.5px;color:var(--txt-faint);margin-top:1px}
.topbar-actions{margin-left:auto;display:flex;gap:9px;align-items:center}
.content{padding:6px 26px 40px;max-width:100%;min-width:0}

/* ---------- COMPONENTS ---------- */
.card{background:var(--panel);border:1px solid var(--stroke);border-radius:var(--r);backdrop-filter:blur(16px);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:var(--r-sm);background:var(--panel-solid);border:1px solid var(--stroke-hi);color:var(--txt);font-weight:600;font-size:12.8px;transition:.15s}
.btn:hover{border-color:var(--teal);transform:translateY(-1px)}
.btn.primary{background:var(--grad);color:#04121a;border:none}
.btn.primary:hover{filter:brightness(1.08);box-shadow:0 8px 24px -8px rgba(99,102,241,.7)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:11.8px}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;font-size:11px;font-weight:700;font-family:var(--mono);letter-spacing:.3px}
.chip.aman{background:rgba(52,211,153,.14);color:var(--green);border:1px solid rgba(52,211,153,.3)}
.chip.waspada{background:rgba(251,191,36,.14);color:var(--amber);border:1px solid rgba(251,191,36,.3)}
.chip.rugi{background:rgba(248,113,113,.14);color:var(--red);border:1px solid rgba(248,113,113,.3)}
.chip.neutral{background:var(--panel-solid);color:var(--txt-dim);border:1px solid var(--stroke)}
.input,.select{width:100%;padding:9px 12px;border-radius:var(--r-sm);background:var(--bg);border:1px solid var(--stroke);color:var(--txt);font-size:13px;transition:.15s}
.input:focus,.select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(45,212,191,.12)}
.input.yellow{background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.28)}
label.fld{display:block;font-size:11.5px;font-weight:600;color:var(--txt-dim);margin-bottom:5px}
.hint{font-size:11px;color:var(--txt-faint);margin-top:4px;line-height:1.4}

.hidden{display:none!important}
.view{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:16px}
.mono{font-family:var(--mono)}
.pos{color:var(--green)} .neg{color:var(--red)} .warn{color:var(--amber)}
/* KPI cards */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:15px}
.kpi{padding:17px 18px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;inset:0;background:var(--grad-soft);opacity:0;transition:.25s}
.kpi:hover::after{opacity:.5}
.kpi-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.kpi-ico{width:34px;height:34px;border-radius:10px;background:var(--grad-soft);display:grid;place-items:center;font-size:16px}
.kpi-label{font-size:11px;font-weight:600;color:var(--txt-dim);text-transform:uppercase;letter-spacing:.6px;margin:13px 0 5px;position:relative;z-index:1}
.kpi-val{font-size:25px;font-weight:800;font-family:var(--mono);letter-spacing:-.5px;position:relative;z-index:1}
.kpi-delta{font-size:11.5px;font-weight:600;margin-top:5px;position:relative;z-index:1;font-family:var(--mono)}

.section-head{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 13px}
.section-head h3{font-size:15px;font-weight:700;letter-spacing:-.2px;display:flex;align-items:center;gap:9px}
.section-head .ln{flex:1}

/* table */
.tbl-wrap{overflow:auto;max-width:100%;border-radius:var(--r);border:1px solid var(--stroke);background:var(--panel);-webkit-overflow-scrolling:touch}
table.dt{width:100%;border-collapse:collapse;font-size:12.6px;white-space:nowrap}
table.dt th{position:sticky;top:0;background:var(--panel-solid);color:var(--txt-dim);font-weight:700;font-size:10.8px;text-transform:uppercase;letter-spacing:.5px;padding:11px 13px;text-align:left;border-bottom:1px solid var(--stroke-hi);cursor:pointer;user-select:none;z-index:2}
table.dt th:hover{color:var(--txt)}
table.dt th .arr{opacity:.4;font-size:9px;margin-left:3px}
table.dt th.sorted .arr{opacity:1;color:var(--teal)}
table.dt td{padding:10px 13px;border-bottom:1px solid var(--stroke);color:var(--txt)}
table.dt tbody tr{transition:.12s}
table.dt tbody tr:hover{background:var(--grad-soft)}
table.dt td.num{font-family:var(--mono);text-align:right}
table.dt .sku{font-family:var(--mono);font-size:11.5px;color:var(--teal)}
.dt-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:13px}
.search-box{position:relative;flex:1;min-width:200px;max-width:340px}
.search-box input{padding-left:34px}
.search-box .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--txt-faint);font-size:13px}
.pagination{display:flex;align-items:center;gap:6px;margin-top:14px;justify-content:flex-end;flex-wrap:wrap}
.pagination button{padding:6px 11px;border-radius:8px;background:var(--panel-solid);border:1px solid var(--stroke);font-size:12px;font-family:var(--mono);color:var(--txt-dim);min-width:34px}
.pagination button:hover:not(:disabled){border-color:var(--teal);color:var(--txt)}
.pagination button.active{background:var(--grad);color:#04121a;border:none;font-weight:700}
.pagination button:disabled{opacity:.35;cursor:default}
.pg-info{font-size:11.5px;color:var(--txt-faint);margin-right:auto;font-family:var(--mono)}

/* calculator */
.calc-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,420px);gap:18px;align-items:start}
.calc-panel{padding:20px}
.calc-panel h4{font-size:13px;font-weight:700;color:var(--teal);margin-bottom:14px;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.5px}
.calc-row{display:grid;grid-template-columns:1fr 120px;gap:10px;align-items:center;margin-bottom:11px}
.calc-row label{font-size:12.5px;color:var(--txt-dim);font-weight:500}
.calc-row .inp{text-align:right;font-family:var(--mono);font-weight:600}
.calc-out{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--stroke)}
.calc-out:last-child{border:none}
.calc-out .lbl{font-size:12.5px;color:var(--txt-dim)}
.calc-out .v{font-family:var(--mono);font-weight:700;font-size:13.5px}
.result-hero{padding:22px;background:var(--grad-soft);border:1px solid var(--stroke-hi);border-radius:var(--r);text-align:center;margin-bottom:16px}
.result-hero .lbl{font-size:11.5px;color:var(--txt-dim);text-transform:uppercase;letter-spacing:.8px;font-weight:700}
.result-hero .big{font-size:44px;font-weight:800;font-family:var(--mono);letter-spacing:-1.5px;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1.05;margin:6px 0}
.result-hero .sub{font-size:12.5px;color:var(--txt-dim);font-family:var(--mono)}
.mini-stats{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:16px}
.mini-stat{padding:13px 15px;background:var(--panel-solid);border:1px solid var(--stroke);border-radius:var(--r-sm)}
.mini-stat .l{font-size:10.5px;color:var(--txt-faint);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.mini-stat .v{font-size:19px;font-weight:800;font-family:var(--mono);margin-top:3px}

/* sim table roas 1-20 */
.sim-tbl{width:100%;border-collapse:collapse;font-size:11.8px;margin-top:6px}
.sim-tbl th{background:var(--panel-solid);color:var(--txt-dim);padding:8px 9px;font-size:10px;text-transform:uppercase;letter-spacing:.4px;text-align:right;position:sticky;top:0}
.sim-tbl th:first-child{text-align:center}
.sim-tbl td{padding:6px 9px;text-align:right;font-family:var(--mono);border-bottom:1px solid var(--stroke)}
.sim-tbl td:first-child{text-align:center;font-weight:700}
.sim-tbl tr.r-aman{background:rgba(52,211,153,.09)}
.sim-tbl tr.r-waspada{background:rgba(251,191,36,.08)}
.sim-tbl tr.r-rugi{background:rgba(248,113,113,.07)}

/* charts */
.chart-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.chart-card{padding:18px}
.chart-card h4{font-size:13.5px;font-weight:700;margin-bottom:4px}
.chart-card .csub{font-size:11.5px;color:var(--txt-faint);margin-bottom:14px}
.chart-box{position:relative;height:280px}
.chart-box.tall{height:340px}

/* import */
.dropzone{border:2px dashed var(--stroke-hi);border-radius:var(--r);padding:42px;text-align:center;transition:.2s;cursor:pointer;background:var(--panel)}
.dropzone:hover,.dropzone.drag{border-color:var(--teal);background:var(--grad-soft)}
.dropzone .ic{font-size:40px;margin-bottom:12px}
.map-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:11px 18px;margin-top:8px}
.map-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center}
.map-row .fromcol{font-family:var(--mono);font-size:12px;color:var(--teal);padding:8px 11px;background:var(--bg);border-radius:8px;border:1px solid var(--stroke)}

/* toast */
.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:100;display:flex;flex-direction:column;gap:10px}
.toast{display:flex;align-items:center;gap:11px;padding:13px 17px;border-radius:var(--r-sm);background:var(--panel-solid);border:1px solid var(--stroke-hi);box-shadow:var(--shadow);font-size:13px;font-weight:500;min-width:260px;animation:slideIn .3s ease;backdrop-filter:blur(10px)}
@keyframes slideIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.toast.ok{border-left:3px solid var(--green)}
.toast.err{border-left:3px solid var(--red)}
.toast.info{border-left:3px solid var(--blue)}
.toast .tic{font-size:17px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(4,8,18,.7);backdrop-filter:blur(4px);z-index:90;display:grid;place-items:center;animation:fade .2s;padding:20px}
.modal{width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:24px;animation:slideIn .25s}
.modal h3{font-size:17px;font-weight:800;margin-bottom:5px}
.modal .msub{font-size:12.5px;color:var(--txt-faint);margin-bottom:18px}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

.filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:16px}
.filter-bar .fg{min-width:130px}
.empty{text-align:center;padding:50px 20px;color:var(--txt-faint)}
.empty .ic{font-size:44px;margin-bottom:12px;opacity:.5}
.store-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.store-tab{padding:8px 15px;border-radius:20px;background:var(--panel);border:1px solid var(--stroke);font-size:12.8px;font-weight:600;color:var(--txt-dim);transition:.15s}
.store-tab:hover{color:var(--txt);border-color:var(--stroke-hi)}
.store-tab.active{background:var(--grad);color:#04121a;border:none}
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid var(--stroke)}
.settings-row:last-child{border:none}
.settings-row .info h5{font-size:13.5px;font-weight:700}
.settings-row .info p{font-size:11.8px;color:var(--txt-faint);margin-top:2px;max-width:420px}
.toggle{width:44px;height:25px;border-radius:20px;background:var(--stroke-hi);position:relative;transition:.2s;flex-shrink:0}
.toggle.on{background:var(--teal)}
.toggle::after{content:"";position:absolute;width:19px;height:19px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}
.toggle.on::after{left:22px}
@media(max-width:960px){.calc-grid{grid-template-columns:minmax(0,1fr)}.chart-grid{grid-template-columns:minmax(0,1fr)}.app{grid-template-columns:minmax(0,1fr)}.sidebar{position:fixed;left:-260px;top:0;bottom:0;width:248px;transition:.25s;z-index:30}.sidebar.open{left:0}.menu-toggle{display:grid!important}.content{padding:6px 14px 40px}.topbar{padding:14px}}
.sim-tbl{min-width:760px}
.menu-toggle{display:none;width:38px;height:38px;place-items:center;border-radius:10px;background:var(--panel-solid);border:1px solid var(--stroke);font-size:18px}
.badge-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
/* header info tooltip */
table.dt th[data-tip]{cursor:help}
table.dt th .ti{display:inline-block;margin-left:4px;font-size:10px;opacity:.45;font-weight:400;vertical-align:top}
table.dt th[data-tip]:hover .ti{opacity:1;color:var(--teal)}
#tooltip{position:fixed;z-index:200;max-width:270px;padding:10px 13px;background:var(--panel-solid);border:1px solid var(--stroke-hi);border-radius:10px;box-shadow:0 10px 34px -8px rgba(0,0,0,.55);font-size:12px;line-height:1.5;color:var(--txt);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .13s,transform .13s;backdrop-filter:blur(10px)}
#tooltip.show{opacity:1;transform:translateY(0)}
#tooltip .tt-title{font-weight:700;color:var(--teal);font-size:11.5px;margin-bottom:3px;letter-spacing:.2px}
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">R</div>
      <div class="brand-txt"><h1>ROAS Command</h1><span>TIKTOK SHOP</span></div>
    </div>
    <nav class="nav">
      <button class="nav-item active" data-view="dashboard"><span class="ico">🏠</span> Dashboard</button>
      <button class="nav-item" data-view="calculator"><span class="ico">📈</span> ROAS Calculator</button>
      <div class="nav-label">Multi ROAS Per Toko</div>
      <button class="nav-item sub" data-view="store" data-store="Yarra Store"><span class="badge-dot" style="background:#2dd4bf"></span>Yarra Store <span class="badge" id="cnt-Yarra-Store">0</span></button>
      <button class="nav-item sub" data-view="store" data-store="Caramel Aksesoris"><span class="badge-dot" style="background:#a855f7"></span>Caramel Aksesoris <span class="badge" id="cnt-Caramel-Aksesoris">0</span></button>
      <button class="nav-item sub" data-view="store" data-store="Minzo Store"><span class="badge-dot" style="background:#60a5fa"></span>Minzo Store <span class="badge" id="cnt-Minzo-Store">0</span></button>
      <button class="nav-item sub" data-view="store" data-store="Topi Keren"><span class="badge-dot" style="background:#fbbf24"></span>Topi Keren <span class="badge" id="cnt-Topi-Keren">0</span></button>
      <div class="nav-label">Tools</div>
      <button class="nav-item" data-view="advisor"><span class="ico">🤖</span> AI Advisor</button>
      <button class="nav-item" data-view="actions"><span class="ico">🎯</span> Action List <span class="badge" id="cnt-actions">0</span></button>
      <button class="nav-item" data-view="analytics"><span class="ico">📊</span> Analytics</button>
      <button class="nav-item" data-view="history"><span class="ico">🕓</span> History Harga <span class="badge" id="cnt-history">0</span></button>
      <button class="nav-item" data-view="weekly"><span class="ico">📉</span> ROI Mingguan <span class="badge" id="cnt-weekly">0</span></button>
      <button class="nav-item" data-view="priceimpact"><span class="ico">💹</span> Dampak Harga <span class="badge" id="cnt-priceimpact">0</span></button>

<script>
/* ============================================================
   ROAS COMMAND CENTER — Single File App
   State + Storage + Calc Engine
   ============================================================ */
const STORES = ["Yarra Store","Caramel Aksesoris","Minzo Store","Topi Keren"];
const LS_KEY = "roas_command_v1";
const DEFAULTS = {komPlat:0.075,komDin:0.08,growth:0.04,proses:1250,logistik:1250,garansi:0,packing:500,affil:0.07,ops:0.1,lain:0,ppn:0.11,targetProfit:0.1,diskon:0};

/* ---- number parsers (dual: pNum handles formatted, pRaw is strict) ---- */
function pRaw(v){ if(v===""||v==null) return null; const n=Number(v); return isNaN(n)?null:n; }
function pNum(v){
  if(v===""||v==null) return null;
  if(typeof v==="number") return isNaN(v)?null:v;
  let s=String(v).trim().replace(/[^\d.,\-]/g,"");
  if(s==="") return null;
  // handle Indonesian format: 1.234.567,89  OR  1,234,567.89
  if(s.includes(",")&&s.includes(".")){
    if(s.lastIndexOf(",")>s.lastIndexOf(".")){ s=s.replace(/\./g,"").replace(",","."); }
    else { s=s.replace(/,/g,""); }
  } else if(s.includes(",")){
    // comma only -> if looks like decimal (one comma, <=2 after) treat as decimal else thousands
    const parts=s.split(","); if(parts.length===2&&parts[1].length<=2){ s=s.replace(",","."); } else { s=s.replace(/,/g,""); }
  } else if((s.match(/\./g)||[]).length>1){ s=s.replace(/\./g,""); }
  const n=Number(s); return isNaN(n)?null:n;
}
function pPct(v){ // accepts 7.5, 7.5%, 0.075
  const n=pNum(v); if(n==null) return null;
  return n>1.5 ? n/100 : n; // heuristic: values >1.5 assumed to be percent points
}

const state = {
  stores:{}, history:[], weekly:[], settings:{theme:"dark",autoLog:true,alloc:0.5,periodDays:7},
  mapping:null, // saved column mapping
  calc:null // saved single-calc inputs
};

function newRow(over={}){ return Object.assign({id:uid(),nama:"",sku:"",productId:"",hpp:0,hargaJual:0,roasAktual:null,spend:null,gmv:null,orders:null,note:"",archived:false,updatedAt:Date.now()}, DEFAULTS, over); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ---- CALC ENGINE (mirrors Excel Kalkulator ROAS + Multi SKU exactly) ---- */
function calcRow(r, alloc){
  alloc = alloc ?? state.settings.alloc ?? 0.5;
  const hpp=+r.hpp||0, hj=+r.hargaJual||0, disk=+r.diskon||0;
  const hargaFinal = hj - disk;
  const marginProfit = hargaFinal - hpp;
  const pctFees = (+r.komPlat||0)+(+r.komDin||0)+(+r.growth||0)+(+r.affil||0)+(+r.ops||0)+(+r.lain||0);
  const flatFees = (+r.proses||0)+(+r.logistik||0)+(+r.garansi||0)+(+r.packing||0);
  const totalPotongan = pctFees*hargaFinal + flatFees;
  const marginKotor = marginProfit - totalPotongan;
  const ppn=+r.ppn||0;
  const marginBersihPPN = (1+ppn)!==0 ? marginKotor/(1+ppn) : 0;
  const tProfit=+r.targetProfit||0;
  const targetProfitRp = tProfit*hargaFinal;
  const budgetIklanIdeal = marginKotor - targetProfitRp;
  const acosIdeal = hargaFinal? budgetIklanIdeal/hargaFinal : 0;
  const targetRoasIdeal = budgetIklanIdeal? hargaFinal/budgetIklanIdeal : 0;
  const roasBEP = marginKotor? hargaFinal/marginKotor : 0;
  const potensiUntung = marginKotor - budgetIklanIdeal;
  const untungPct = hargaFinal? potensiUntung/hargaFinal : 0;
  const roi = budgetIklanIdeal? potensiUntung/budgetIklanIdeal : 0;

  // actual sim
  const roasAkt = (r.roasAktual===""||r.roasAktual==null)?null:+r.roasAktual;
  let budgetAkt=null, profitAkt=null, profitAktPct=null, status="-", roiAkt=null;
  if(roasAkt!=null && roasAkt>0){
    budgetAkt = hargaFinal/roasAkt;
    profitAkt = marginKotor - budgetAkt;
    profitAktPct = hargaFinal? profitAkt/hargaFinal : 0;
    roiAkt = budgetAkt? profitAkt/budgetAkt : 0;
    // Tentukan status dengan pengaman berlapis:
    // 1) profit aktual negatif → selalu RUGI (ROAS tinggi pun percuma)
    // 2) target ROAS tak valid (≤0, karena margin < target profit) → tak bisa "AMAN"
    // 3) selain itu pakai ambang ROAS normal
    const targetValid = isFinite(targetRoasIdeal) && targetRoasIdeal>0;
    const bepValid = isFinite(roasBEP) && roasBEP>0;
    if(profitAkt<0){ status="RUGI"; }
    else if(targetValid && roasAkt>=targetRoasIdeal){ status="AMAN"; }
    else if(bepValid && roasAkt>=roasBEP){ status="WASPADA"; }
    else { status="RUGI"; }
  }
  // saran harga jual agar profit = target% at actual roas
  let saranHarga="-", selisih="-";
  if(roasAkt!=null && roasAkt>0){
    if(profitAktPct!=null && profitAktPct>=tProfit){ saranHarga=`Sudah profit ${(tProfit*100).toFixed(0)}% ✓`; }
    else {
      const denom = 1 - pctFees - 1/roasAkt - tProfit;
      if(denom<=0){ saranHarga="Tidak mungkin di ROAS ini"; }
      else { const sh = (flatFees+hpp)/denom + disk; saranHarga=Math.round(sh); selisih=Math.round(sh-hj); }
    }
  }
  return {hargaFinal,marginProfit,marginProfitPct:hargaFinal?marginProfit/hargaFinal:0,pctFees,flatFees,totalPotongan,marginKotor,marginKotorPct:hargaFinal?marginKotor/hargaFinal:0,marginBersihPPN,targetProfitRp,budgetIklanIdeal,acosIdeal,targetRoasIdeal,roasBEP,potensiUntung,untungPct,roi,roasAkt,budgetAkt,profitAkt,profitAktPct,roiAkt,status,saranHarga,selisih};
}

/* ---- VARIANT CALC: warisi ROAS & fee dari parent, pakai HPP & harga varian sendiri ---- */
// v = {hpp, hargaJual, ...} ; parent = row induk (untuk fee & roasAktual)
function calcVariant(v, parent){
  const merged=Object.assign({},parent,{
    hpp:+v.hpp||0,
    hargaJual:(v.hargaJual!=null&&v.hargaJual!=="")?+v.hargaJual:(+parent.hargaJual||0),
    diskon:0,
    roasAktual:parent.roasAktual // ROAS diwariskan dari parent
  });
  return calcRow(merged);
}

/* ---- normalisasi field ekonomi untuk row lama (backward-compat) ---- */
function normalizeEcon(){
  STORES.forEach(s=>{ (state.stores[s]||[]).forEach(r=>{
    if(r.productId===undefined) r.productId="";
    if(r.spend===undefined) r.spend=null;
    if(r.gmv===undefined) r.gmv=null;
    if(r.orders===undefined) r.orders=null;
  }); });
}

/* ---- agregat ekonomi per toko (untuk spendShare & KPI) ---- */
function storeEconomics(store){
  const rows=(state.stores[store]||[]).filter(r=>!r.archived);
  let storeSpend=0, storeGmv=0, storeProfit=0, adSkus=0;
  rows.forEach(r=>{
    const c=calcRow(r);
    if(+r.spend>0){ storeSpend+=+r.spend; adSkus++; }
    if(+r.gmv>0) storeGmv+=+r.gmv;
    if(c.profitAkt!=null && +r.orders>0) storeProfit += c.profitAkt*(+r.orders);
  });
  const storeRoas = storeSpend ? storeGmv/storeSpend : null;
  return {storeSpend, storeGmv, storeProfit, storeRoas, adSkus};
}

/* ---- Decision Engine: gate PUSH / MONITOR / STOP ---- */
function clampN(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
function calcGate(r, c, agg){
  const roasAkt=c.roasAkt, target=c.targetRoasIdeal, bep=c.roasBEP;
  const orders=(+r.orders>0)?+r.orders:null;
  const hasVol=(+r.spend>0)||(orders!=null);
  const profitTot=(c.profitAkt!=null && orders!=null)? c.profitAkt*orders : null;
  const spendShare=(agg && agg.storeSpend && +r.spend>0)? (+r.spend/agg.storeSpend) : null;

  let gate="NO_DATA", action="Belum ada ROAS — import campaign", budgetDir="hold", budgetPct=0, reason="";
  if(roasAkt!=null && roasAkt>0 && target>0 && bep>0){
    if(roasAkt>=target && c.profitAkt>=0){
      gate="PUSH"; budgetDir="up";
      const over=(roasAkt/target)-1;
      budgetPct=clampN(Math.round(over*100/2),10,50);
      action="Scale +"+budgetPct+"% budget";
      reason="ROAS "+roasAkt.toFixed(1)+" ≥ target "+target.toFixed(1);
    } else if(roasAkt>=bep && c.profitAkt>=0){
      gate="MONITOR"; budgetDir="hold"; budgetPct=0;
      if(roasAkt < bep*1.1){ action="Waspada — dekat BEP, siapkan exit"; }
      else { action="Tahan budget, optimize kreatif/harga"; }
      reason="ROAS "+roasAkt.toFixed(1)+" antara BEP "+bep.toFixed(1)+" & target "+target.toFixed(1);
    } else {
      gate="STOP"; budgetDir="down";
      const gap=1-(roasAkt/bep);
      budgetPct=clampN(Math.round(gap*100),30,100);
      action = gap>0.5 ? "Matikan iklan SKU ini" : "Turunkan budget -"+budgetPct+"% / naikkan harga";
      reason="ROAS "+roasAkt.toFixed(1)+" < BEP "+bep.toFixed(1)+" (rugi)";
    }
  } else if(roasAkt!=null && roasAkt>0 && c.profitAkt!=null && c.profitAkt<0){
    // margin terlalu tipis: target ROAS tak valid tapi profit riil rugi → tetap STOP
    gate="STOP"; budgetDir="down"; budgetPct=100;
    action="Margin terlalu tipis — naikkan harga / matikan iklan";
    reason="Profit aktual "+fmtRp(c.profitAkt)+" (margin kotor "+fmtRp(c.marginKotor)+" tak menutup iklan)";
  }
  // severity untuk ranking Action List
  let severity;
  if(profitTot!=null){
    severity=Math.abs(profitTot)*(gate==="STOP"?2:gate==="PUSH"?1.2:0.5);
  } else if(roasAkt!=null){
    severity=Math.abs((roasAkt)-(gate==="STOP"?bep:target))*1000;
  } else severity=0;

  return {gate, action, budgetDir, budgetPct, reason, profitTot, spendShare, severity, hasVol};
}

/* ---- kumpulkan gate untuk semua SKU (dipakai dashboard & Action List) ---- */
function collectGates(storeFilter){
  const out=[];
  const stores = storeFilter ? [storeFilter] : STORES;
  stores.forEach(s=>{
    const agg=storeEconomics(s);
    (state.stores[s]||[]).filter(r=>!r.archived).forEach(r=>{
      const c=calcRow(r);
      if(c.roasAkt==null) return; // skip tanpa ROAS
      const g=calcGate(r,c,agg);
      out.push({store:s, r, c, g});
    });
  });
  return out;
}
function gateSummary(list){
  const acc={PUSH:{n:0,rp:0},MONITOR:{n:0,rp:0},STOP:{n:0,rp:0},NO_DATA:{n:0,rp:0}};
  list.forEach(({g})=>{ const b=acc[g.gate]||acc.NO_DATA; b.n++; if(g.profitTot!=null)b.rp+=g.profitTot; });
  return acc;
}
// kumpulkan VARIAN rugi dari semua parent (parent bisa saja AMAN/WASPADA)
// output diurutkan: parent aman/waspada dulu (bocor tersembunyi), lalu keparahan profit%
function collectLosingVariants(storeFilter){
  const out=[];
  const stores = storeFilter ? [storeFilter] : STORES;
  stores.forEach(s=>{
    (state.stores[s]||[]).filter(r=>!r.archived && Array.isArray(r.variants) && r.variants.length).forEach(parent=>{
      if(parent.roasAktual==null) return;
      const pc=calcRow(parent);
      parent.variants.forEach(v=>{
        const vc=calcVariant(v,parent);
        if(vc.status==="RUGI" && vc.profitAkt!=null){
          out.push({store:s, parent, parentStatus:pc.status, v, vc,
            hidden:(pc.status==="AMAN"||pc.status==="WASPADA")});
        }
      });
    });
  });
  // hidden (parent aman) di atas, lalu profit% paling parah
  out.sort((a,b)=>{
    if(a.hidden!==b.hidden) return a.hidden?-1:1;
    return (a.vc.profitAktPct??0)-(b.vc.profitAktPct??0);
  });
  return out;
}

/* ROAS 1-20 simulation table (mirrors G-P columns) */
/* ============================================================
   #4 ANOMALY DETECTION — bandingkan snapshot terbaru vs sebelumnya
   + sinyal intra-row (spend tinggi tanpa order, ROAS < BEP, dsb)
   ============================================================ */
function detectAnomalies(opts){
  opts=opts||{};
  const out=[]; // {store,sku,type,sev,title,detail,cur,prev,delta}
  const weeks=state.weekly||[];
  const cur = weeks.length? weeks[weeks.length-1] : null;
  // prev = snapshot sebelumnya dari TOKO yang sama (auto-import kini per-toko)
  let prev=null;
  if(cur){
    const same=weeks.filter(w=>(w.store||"")===(cur.store||""));
    prev = same.length>1? same[same.length-2] : null;
  }
  const curMap = cur? snapMap(cur) : null;
  const prevMap = prev? snapMap(prev) : null;

  // --- A. Perbandingan minggu-ke-minggu (butuh ≥2 snapshot) ---
  if(curMap && prevMap){
    Object.keys(curMap).forEach(key=>{
      const c=curMap[key], p=prevMap[key]; if(!p) return;
      const [store,sku]=key.split("|");
      // ROAS drop signifikan
      if(c.roas!=null && p.roas!=null && p.roas>0){
        const dropPct=(p.roas-c.roas)/p.roas;
        if(dropPct>=0.25){
          out.push({store,sku,type:"roas_drop",sev:dropPct*(c.status==="RUGI"?2:1),
            title:"ROAS turun tajam", detail:`ROAS ${fmtX(p.roas)} → ${fmtX(c.roas)} (−${Math.round(dropPct*100)}%)`,
            cur:c.roas,prev:p.roas,delta:c.roas-p.roas});
        }
      }
      // Profit/order berbalik negatif
      if(c.profit!=null && p.profit!=null && p.profit>=0 && c.profit<0){
        out.push({store,sku,type:"profit_flip",sev:Math.abs(c.profit)/1000+2,
          title:"Profit berbalik rugi", detail:`Profit/order ${fmtRp(p.profit)} → ${fmtRp(c.profit)}`,
          cur:c.profit,prev:p.profit,delta:c.profit-p.profit});
      }
      // Status memburuk
      const rank={AMAN:0,WASPADA:1,RUGI:2};
      if(rank[c.status]>rank[p.status]){
        out.push({store,sku,type:"status_down",sev:(rank[c.status]-rank[p.status])+0.5,
          title:"Status memburuk", detail:`${p.status} → ${c.status}`,cur:null,prev:null,delta:null});
      }
    });
    // SKU hilang dari campaign (ada minggu lalu, hilang minggu ini) — potensi mati mendadak
    Object.keys(prevMap).forEach(key=>{
      if(!curMap[key] && prevMap[key].roas!=null){
        const [store,sku]=key.split("|");
        out.push({store,sku,type:"disappeared",sev:1,
          title:"SKU hilang dari data terbaru", detail:`Ada di snapshot ${prev.label}, tidak ada di ${cur.label}`,cur:null,prev:prevMap[key].roas,delta:null});
      }
    });
  }

  // --- B. Sinyal intra-row (tidak butuh snapshot) ---
  STORES.forEach(s=>{
    const agg=storeEconomics(s);
    (state.stores[s]||[]).filter(r=>!r.archived).forEach(r=>{
      const c=calcRow(r);
      // Spend besar tapi order 0 → bakar budget tanpa hasil
      if(+r.spend>0 && (r.orders===0 || r.orders===null) && +r.spend>=50000){
        out.push({store:s,sku:r.sku||r.nama,type:"spend_no_order",sev:(+r.spend)/50000+2,
          title:"Spend jalan tanpa order", detail:`Spend ${fmtRp(r.spend)} tapi ${r.orders===0?"0 order":"order belum terisi"}`,cur:null,prev:null,delta:null});
      }
      // Konsentrasi budget: 1 SKU >40% spend toko tapi rugi/waspada
      if(c.roasAkt!=null && agg.storeSpend>0 && +r.spend/agg.storeSpend>=0.4 && c.status!=="AMAN"){
        out.push({store:s,sku:r.sku||r.nama,type:"budget_concentration",sev:(+r.spend/agg.storeSpend)+1,
          title:"Konsentrasi budget berisiko", detail:`${Math.round(+r.spend/agg.storeSpend*100)}% budget ${s} di SKU ${c.status}`,cur:null,prev:null,delta:null});
      }
    });
  });

  out.sort((a,b)=>b.sev-a.sev);
  return out;
}
function anomalySummary(list){
  return {total:list.length,
    critical:list.filter(a=>a.sev>=2).length,
    byType:list.reduce((m,a)=>{m[a.type]=(m[a.type]||0)+1;return m;},{})};
}

function simTable(r){
  const c=calcRow(r); const hpp=+r.hpp||0,hj=+r.hargaJual||0,disk=+r.diskon||0,tp=+r.targetProfit||0;
  const rows=[];
  for(let roas=1;roas<=20;roas++){
    const budget=c.hargaFinal/roas;
    const profit=c.marginKotor-budget;
    const profitPct=c.hargaFinal?profit/c.hargaFinal:0;
    const status=roas>=c.targetRoasIdeal?"AMAN":(roas>=c.roasBEP?"WASPADA":"RUGI");
    const denom=1-c.pctFees-1/roas;
    let hjIdeal="-",profitIdeal="-",profitIdealPct="-";
    if(denom>0){
      hjIdeal=(c.flatFees+hpp+tp*c.hargaFinal)/denom+disk;
      profitIdeal=(hjIdeal-disk)*(1-c.pctFees)-c.flatFees-hpp-(hjIdeal-disk)/roas;
      profitIdealPct=c.hargaFinal?profitIdeal/c.hargaFinal:0;
    }
    rows.push({roas,hj,hargaFinal:c.hargaFinal,budget,profit,profitPct,status,hjIdeal,profitIdeal,profitIdealPct});
  }
  return rows;
}

/* ---- formatters ---- */
const fmtRp=n=>(n==null||isNaN(n))?"–":"Rp "+Math.round(n).toLocaleString("id-ID");
const fmtN=n=>(n==null||isNaN(n))?"–":Math.round(n).toLocaleString("id-ID");
const fmtPct=n=>(n==null||isNaN(n))?"–":(n*100).toFixed(1)+"%";
const fmtX=n=>(n==null||isNaN(n)||!isFinite(n))?"–":n.toFixed(2)+"x";
const dtFmt=t=>{const d=new Date(t);return d.toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"})+" "+d.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});};
</script>

function logPriceChange(toko, row, oldPrice, newPrice, note, jenis){
  oldPrice=+oldPrice||0; newPrice=+newPrice||0;

  const delta=newPrice-oldPrice;
  state.history.unshift({id:uid(),ts:Date.now(),toko,sku:row.sku,nama:row.nama,jenis:jenis||"Harga Jual",sebelum:oldPrice,sesudah:newPrice,delta,catatan:note||"Ubah harga manual"});
}
// set HPP & Harga Jual parent dari SATU varian ber-HPP tertinggi (harga jual mengikuti varian itu).
function syncParentFromVariants(store,parent,note){
  if(!Array.isArray(parent.variants)||!parent.variants.length) return;
  // pilih varian dengan HPP tertinggi (yang punya HPP>0)
  let top=null;
  parent.variants.forEach(v=>{ const h=+v.hpp||0; if(h>0 && (!top || h>(+top.hpp||0))) top=v; });
  if(!top) return;
  const newHpp=+top.hpp||0;
  const newHarga=(top.hargaJual!=null&&+top.hargaJual>0)?+top.hargaJual:(+parent.hargaJual||0); // harga jual ikut varian ber-HPP tertinggi
  if((+parent.hpp||0)!==newHpp){ logPriceChange(store,parent,parent.hpp||0,newHpp,note||"Auto dari varian ber-HPP tertinggi","HPP"); parent.hpp=newHpp; parent.updatedAt=Date.now(); }
  if((+parent.hargaJual||0)!==newHarga){ logPriceChange(store,parent,parent.hargaJual||0,newHarga,note||"Ikut harga jual varian ber-HPP tertinggi","Harga Jual"); parent.hargaJual=newHarga; parent.updatedAt=Date.now(); }
}

// ISO week label e.g. "2026-W27"
function isoWeek(d){
  d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=d.getUTCDay()||7; d.setUTCDate(d.getUTCDate()+4-day);
  const yStart=new Date(Date.UTC(d.getUTCFullYear(),0,1));
  const wk=Math.ceil((((d-yStart)/86400000)+1)/7);
  return d.getUTCFullYear()+"-W"+String(wk).padStart(2,"0");
}

// Jika snapshot dipicu import 1 toko (impLastStore terisi), snapshot HANYA berisi
// SKU toko itu — supaya perbandingan tidak tercampur SKU toko lain yang tak berubah.
function buildSnapshot(label,source){
  const ts=Date.now();
  const onlyStore=(typeof impLastStore!=="undefined"?impLastStore:"")||"";
  const scopeStores = onlyStore ? [onlyStore] : STORES;
  const scopeRows = onlyStore ? (state.stores[onlyStore]||[]).map(r=>({...r,_store:onlyStore})) : allRows();
  const items=[]; const ag=aggregate(scopeRows);
  scopeStores.forEach(s=>(state.stores[s]||[]).forEach(r=>{
    if(r.archived) return;
    const c=calcRow(r);
    items.push({store:s,sku:r.sku||"",nama:r.nama||"",
      hargaJual:r.hargaJual||0,
      roi:(c.roiAkt!=null?c.roiAkt:null),
      roas:(c.roasAkt!=null?c.roasAkt:null),
      targetRoas:(isFinite(c.targetRoasIdeal)?c.targetRoasIdeal:null),
      profit:(c.profitAkt!=null?c.profitAkt:null),
      profitPct:(c.profitAktPct!=null?c.profitAktPct:null),
      margin:c.marginKotor,marginPct:c.marginKotorPct,status:c.status});
  }));
  return {id:uid(),ts,label:label||isoWeek(new Date()),source:source||"manual",
    perStart:(typeof impPeriod!=="undefined"?impPeriod.start:"")||"",
    perEnd:(typeof impPeriod!=="undefined"?impPeriod.end:"")||"",
    store:onlyStore,
    agg:{avgRoi:ag.avgRoi,avgProfitPct:ag.avgProfitPct,avgRoas:ag.avgRoas,avgTargetRoas:ag.avgTargetRoas,sumProfit:ag.sumProfit,sumMargin:ag.sumMargin,avgMargin:ag.avgMargin,aman:ag.aman,waspada:ag.waspada,rugi:ag.rugi,n:ag.n,cntRoas:ag.cntRoas},

}
// take snapshot; overwrite only if SAME period label AND SAME store already exists
// (dulu hanya cek label → import toko lain di periode sama menimpa snapshot toko sebelumnya)
function takeSnapshot(source,customLabel){
  const label=customLabel||isoWeek(new Date());
  const snap=buildSnapshot(label,source);
  const store=snap.store||"";
  const idx=state.weekly.findIndex(w=>w.label===label && (w.store||"")===store);
  if(idx>=0){ snap.id=state.weekly[idx].id; state.weekly[idx]=snap; }
  else state.weekly.push(snap);
  // urutkan: periode dulu, lalu nama toko
  state.weekly.sort((a,b)=>{
    const ka=a.perStart?new Date(a.perStart).getTime():a.ts;
    const kb=b.perStart?new Date(b.perStart).getTime():b.ts;
    if(ka!==kb) return ka-kb;
    return (a.store||"").localeCompare(b.store||"");
  });
  save();
  return {snap,replaced:idx>=0};
}

// daftar periode unik (label), diurutkan berdasarkan tanggal periode/ts, terlama→terbaru
function periodList(){
  const seen=new Map();
  (state.weekly||[]).forEach(w=>{
    const key=w.label;
    const t=w.perStart?new Date(w.perStart+"T00:00:00").getTime():w.ts;
    if(!seen.has(key)||t<seen.get(key).t) seen.set(key,{label:key,t});
  });
  return [...seen.values()].sort((a,b)=>a.t-b.t).map(x=>x.label);
}

function mergedPeriodMap(label){
  const m={};
  (state.weekly||[]).filter(w=>w.label===label).forEach(w=>{
    (w.items||[]).forEach(it=>{ m[it.store+"|"+(it.sku||it.nama)]=it; });
  });
  return m;
}

function periodStores(label){
  const s=new Set();

  const t=_tt(); const r=target.getBoundingClientRect(); const tw=t.offsetWidth, th=t.offsetHeight;
  let left=r.left+r.width/2-tw/2;
  left=Math.max(10,Math.min(left,window.innerWidth-tw-10));
  let top=r.bottom+9;
  if(top+th>window.innerHeight-10) top=r.top-th-9; // flip above if no room below
  t.style.left=left+"px"; t.style.top=Math.max(10,top)+"px";
}
function hideTip(){ if(_ttEl) _ttEl.classList.remove("show"); }
// delegate hover for any element carrying data-tip
document.addEventListener("mouseover",e=>{const el2=e.target.closest("[data-tip]");if(el2)showTip(el2);});
document.addEventListener("mouseout",e=>{if(e.target.closest("[data-tip]"))hideTip();});
document.addEventListener("click",e=>{const el2=e.target.closest("[data-tip]");if(el2){showTip(el2);setTimeout(hideTip,2600);}});
function toast(msg,type="info"){
  const w=$("#toastWrap"); const ic={ok:"✅",err:"⚠️",info:"ℹ️"}[type]||"ℹ️";
  const t=el("div","toast "+type,`<span class="tic">${ic}</span><span>${msg}</span>`);
  w.appendChild(t); setTimeout(()=>{t.style.opacity="0";t.style.transform="translateX(40px)";t.style.transition=".3s";setTimeout(()=>t.remove(),300);},3200);
}
function modal(title,sub,bodyHTML,footHTML){
  const root=$("#modalRoot");
  root.innerHTML=`<div class="modal-bg" id="mbg"><div class="modal card">
    <h3>${title}</h3>${sub?`<div class="msub">${sub}</div>`:""}
    <div id="modalBody">${bodyHTML}</div>
    <div class="modal-foot">${footHTML||'<button class="btn" data-close>Tutup</button>'}</div>
  </div></div>`;
  $("#mbg").addEventListener("click",e=>{if(e.target.id==="mbg")closeModal();});
  $$("#modalRoot [data-close]").forEach(b=>b.onclick=closeModal);
  return root;
}
function closeModal(){ $("#modalRoot").innerHTML=""; }
function confirmDialog(title,msg,onYes,yesLabel="Ya, Lanjut",danger=true){
  modal(title,"",`<p style="color:var(--txt-dim);font-size:13.5px;line-height:1.55">${msg}</p>`,
    `<button class="btn" data-close>Batal</button><button class="btn ${danger?'danger':'primary'}" id="cfYes">${yesLabel}</button>`);

}

const statusChip=st=>{const m={AMAN:"aman",WASPADA:"waspada",RUGI:"rugi"};return st&&m[st]?`<span class="chip ${m[st]}">${st}</span>`:`<span class="chip neutral">–</span>`;};

function render(){

  ({dashboard:renderDashboard,calculator:renderCalculator,store:renderStore,actions:renderActions,advisor:renderAdvisor,analytics:renderAnalytics,history:renderHistory,weekly:renderWeekly,priceimpact:renderPriceImpact,import:renderImport,backup:renderBackup,settings:renderSettings,panduan:renderPanduan}[current.view]||renderDashboard)(c);

  const ac=$("#cnt-actions"); if(ac){ const g=collectGates().filter(x=>x.g.gate==="STOP"||x.g.gate==="PUSH").length; ac.textContent=g; }

<script>
/* ============================================================
   VIEW: DASHBOARD
   ============================================================ */
function kpi(ico,label,val,delta){

const dashUI={store:""};
function renderDashboard(c){

    <div class="card" style="padding:18px"><div class="kpi-label">⬜ Tanpa Data</div><div class="kpi-val" style="color:var(--txt-faint)">${totalProduk-a2.cntRoas}</div><div class="hint">belum ada ROAS aktual</div></div>
  </div>
  <div id="alertPanel"></div>
  <div class="section-head"><h3>🎯 Rekomendasi Aksi (Decision Engine)${dashUI.store?` — ${dashUI.store}`:""}</h3><button class="btn sm ghost" id="dbGoActions" style="margin-left:auto">Lihat Action List →</button></div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(210px,1fr))" id="gatePanel"></div>
  <div class="section-head"><h3>🏪 Ringkasan Per Toko</h3></div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(250px,1fr))" id="storeCards"></div>
  <div class="section-head"><h3>⚠️ Butuh Perhatian — Produk Rugi / Waspada${dashUI.store?` — ${dashUI.store}`:""}</h3></div>
  <div id="attnTbl"></div>`;

  const sc=$("#storeCards");
  scopeStores.forEach((s,i)=>{
    const ag=aggregate(state.stores[s]);
    const col=["#2dd4bf","#a855f7","#60a5fa","#fbbf24"][STORES.indexOf(s)%4];
    sc.innerHTML+=`<div class="card" style="padding:18px;cursor:pointer" data-gostore="${s}">
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:12px"><span class="badge-dot" style="background:${col};width:9px;height:9px"></span><b style="font-size:14px">${s}</b><span class="badge" style="margin-left:auto">${state.stores[s].length} SKU</span></div>

  $$("[data-gostore]").forEach(x=>x.onclick=()=>nav("store",x.dataset.gostore));

  // attention table (scoped)

  if(attn.length){

    attn.forEach(({r,c:cc})=>{h+=`<tr><td>${r._store}</td><td class="sku">${r.sku||"–"}</td><td class="num">${fmtRp(cc.hargaFinal)}</td><td class="num">${fmtX(cc.roasAkt)}</td><td class="num">${fmtX(cc.targetRoasIdeal)}</td><td class="num">${fmtX(cc.roasBEP)}</td><td class="num ${cc.profitAkt<0?'neg':'warn'}">${fmtRp(cc.profitAkt)}</td><td>${statusChip(cc.status)}</td></tr>`;});

      <div class="card" style="padding:0;overflow:hidden;border-left:3px solid var(--red)">
        <div class="tbl-wrap"><table class="dt"><thead><tr><th>Toko</th><th>SKU</th><th>Anomali</th><th>Detail</th></tr></thead><tbody>

        </tbody></table></div>

  }

  $("#dbCalc").onclick=()=>nav("calculator");
  $("#dbExport").onclick=exportAllExcel;
}

<script>
/* ============================================================

function getCalcInputs(){
  return state.calc || (state.calc = newRow({nama:"Produk Baru",sku:"",hpp:30400,hargaJual:64500,roasAktual:20}));
}
function renderCalculator(c){
  const r=getCalcInputs(); 
  $("#topActions").innerHTML=`<button class="btn sm ghost" id="calcReset">↺ Reset</button><button class="btn sm primary" id="calcSaveToStore">💾 Simpan ke Toko</button>`;
  c.innerHTML=`<div class="calc-grid">
    <div>
      <div class="card calc-panel">
        <h4>📝 Info Produk</h4>
        <div class="calc-row"><label>SKU ID</label><input class="input inp" id="c_sku" value="${r.sku||""}" style="text-align:left"></div>
      </div>
      <div class="card calc-panel" style="margin-top:16px">
        <h4>1️⃣ Input Harga & Margin</h4>
        ${ci("c_hpp","HPP (Harga Ambil)",r.hpp,"rp")}
        ${ci("c_hargaJual","Harga Jual (Marketplace)",r.hargaJual,"rp")}

    else if(type==="pct"){r[key]=pPct(v)??0;}
    else {r[key]=pNum(v)??(key==="roasAktual"?null:0);}

  bind("c_sku","sku");

  $("#calcSaveToStore").onclick=saveCalcToStore;
}
function ci(id,label,val,type){
  let disp=val;
  if(type==="pct") disp=(val==null?"":cleanNum(val*100));
  else if(type==="x") disp=(val==null?"":cleanNum(val));
  const suf=type==="pct"?" %":(type==="x"?" x":"");

// ringkasan verdict varian sebuah parent
function variantStats(parent){
  let n=0,aman=0,was=0,rugi=0,nodata=0;
  (parent.variants||[]).forEach(v=>{
    n++;
    if(parent.roasAktual==null){nodata++;return;}
    const c=calcVariant(v,parent);
    if(c.status==="AMAN")aman++; else if(c.status==="WASPADA")was++; else if(c.status==="RUGI")rugi++; else nodata++;
  });
  return {n,aman,was,rugi,nodata};
}
// tampilan sel "Saran Harga (10%)" untuk varian
function varSaranHargaCell(c,noRoas){
  if(noRoas) return '<span style="color:var(--txt-faint)">—</span>';
  const sh=c.saranHarga;
  if(typeof sh==="number"){
    const naik=c.selisih>0;
    const arrow=naik?`<span class="neg" style="font-size:10px">▲ +${fmtN(c.selisih)}</span>`:(c.selisih<0?`<span class="pos" style="font-size:10px">▼ ${fmtN(c.selisih)}</span>`:"");
    return `<b>${fmtN(sh)}</b> ${arrow}`;
  }
  if(typeof sh==="string"){
    if(sh.startsWith("Sudah")) return `<span class="chip aman" style="padding:0 6px;font-size:10px">✓ ≥10%</span>`;
    if(sh.startsWith("Tidak")) return `<span class="chip rugi" style="padding:0 6px;font-size:10px" data-tip="ROAS terlalu rendah — 10% profit tak tercapai berapa pun harganya">tak mungkin</span>`;
  }
  return '<span style="color:var(--txt-faint)">—</span>';
}

function drawStoreTable(){

  const q=storeUI.q, sf=$("#stStatusF")?.value||"";
  if(q) list=list.filter(({r})=>(r.sku||"").toLowerCase().includes(q)||(r.productId||"").toLowerCase().includes(q));
  if(sf) list=list.filter(({c})=>c.status===sf);

    // hanya parent AMAN/WASPADA yang punya ≥1 varian RUGI (titik bocor tersembunyi)
    list=list.filter(({r,c})=>{
      if(!Array.isArray(r.variants)||!r.variants.length) return false;
      const vst=variantStats(r);
      return vst.rugi>0 && (c.status==="AMAN"||c.status==="WASPADA");
    });
  }
  // sort
  const {col,dir}=storeUI.sort;
  list.sort((a,b)=>{
    let va=STORE_COLS.find(x=>x.k===col)?.calc? a.c[col] : a.r[col];
    let vb=STORE_COLS.find(x=>x.k===col)?.calc? b.c[col] : b.r[col];
    if(typeof va==="string"){va=(va||"").toLowerCase();vb=(vb||"").toLowerCase();return va<vb?-dir:va>vb?dir:0;}
    va=va??-Infinity;vb=vb??-Infinity;return (va-vb)*dir;
  });
  const total=list.length, pages=Math.max(1,Math.ceil(total/storeUI.per));

    } else {
      sum.innerHTML=`Margin total <b>${fmtRp(ag.sumMargin)}</b> · <span class="pos">${ag.aman}</span>/<span class="warn">${ag.waspada}</span>/<span class="neg">${ag.rugi}</span>${nArsip?` · <span style="color:var(--txt-faint)">${nArsip} diarsip</span>`:''}`;
    }
  }

  if(!pageRows.length){
    const msg = storeUI.varView==="loss"
      ? `<div class="empty"><div class="ic">✅</div>Tidak ada varian rugi di parent yang aman. Semua bersih — atau parent-nya belum punya data varian/ROAS.</div>`

    h+=`<tr><td colspan="${STORE_COLS.length+1}">${msg}</td></tr>`;
  }
  pageRows.forEach(({r,c})=>{
    const hasVar=Array.isArray(r.variants)&&r.variants.length>0;

        }
        h+=`<td ${['hpp','hargaJual','diskon'].includes(col.k)?'class="num"':''}>${pre}<input class="cell-inp" data-k="${col.k}" data-price="${col.price?1:0}" value="${col.t==='text'||col.t==='sku'?(v??''):(v??'')}" style="width:${col.w?col.w:88}px;background:transparent;border:1px solid var(--stroke);border-radius:6px;padding:5px 7px;color:var(--txt);font-family:${col.t==='text'?'var(--sans)':'var(--mono)'};font-size:12px;${['hpp','hargaJual','diskon'].includes(col.k)?'text-align:right':''}"></td>`;
      } else {
        h+=`<td class="${col.t==='rp'||col.t==='pct'||col.t==='x'||col.t==='int'?'num':''}" data-calc="${col.k}">${calcCellDisp(col,c,r,econAgg)}</td>`;
      }
    });

      h+=`<td style="white-space:nowrap"><button class="btn sm ghost" data-restore="${r.id}" style="padding:4px 9px" data-tip="Aktifkan kembali produk ini" data-tip-title="Kembalikan">↩️ Kembalikan</button> <button class="btn sm danger" data-del="${r.id}" style="padding:4px 8px">🗑</button></td></tr>`;
    } else {

  $("#stTblWrap").innerHTML=h;

  // sort handlers
  $$("#stTblWrap th[data-sort]").forEach(th=>th.onclick=()=>{const k=th.dataset.sort;if(storeUI.sort.col===k)storeUI.sort.dir*=-1;else{storeUI.sort.col=k;storeUI.sort.dir=1;}drawStoreTable();});

  $$("#stTblWrap [data-vtoggle]").forEach(b=>b.onclick=()=>{const id=b.dataset.vtoggle;storeUI.expanded[id]=!storeUI.expanded[id];drawStoreTable();});

  $$("#stTblWrap .cell-inp").forEach(inp=>{
    inp.addEventListener("change",()=>{
      const tr=inp.closest("tr"); const id=tr.dataset.id; const row=state.stores[s].find(x=>x.id===id); if(!row)return;

  $$("#stTblWrap [data-del]").forEach(b=>b.onclick=()=>{const id=b.dataset.del;const row=state.stores[s].find(x=>x.id===id);confirmDialog("Hapus Produk",`Hapus <b>${row.sku||row.nama}</b> dari ${s}? Data tidak bisa dikembalikan (beda dengan Arsip).`,()=>{state.stores[s]=state.stores[s].filter(x=>x.id!==id);save();refreshCounts();renderStore($("#content"));toast("Produk dihapus","ok");});});
  $$("#stTblWrap [data-arsip]").forEach(b=>b.onclick=()=>{const id=b.dataset.arsip;const row=state.stores[s].find(x=>x.id===id);if(!row)return;row.archived=true;row.archivedAt=Date.now();row.updatedAt=Date.now();save();refreshCounts();renderStore($("#content"));toast(`SKU ${row.sku||row.nama} diarsipkan`,"ok");});
  $$("#stTblWrap [data-restore]").forEach(b=>b.onclick=()=>{const id=b.dataset.restore;const row=state.stores[s].find(x=>x.id===id);if(!row)return;row.archived=false;delete row.archivedAt;row.updatedAt=Date.now();save();refreshCounts();renderStore($("#content"));toast(`SKU ${row.sku||row.nama} dikembalikan`,"ok");});
  drawPagination("#stPag",storeUI,total,pages,drawStoreTable);
}
// render satu sel kalkulasi (dipakai bersama oleh drawStoreTable & updateStoreRow)
function calcCellDisp(col,c,r,agg){
  if(col.t==="status")return statusChip(c.status);
  if(col.t==="saran")return typeof c.saranHarga==="number"?fmtRp(c.saranHarga):`<span style="font-size:11px;color:var(--txt-faint)">${c.saranHarga}</span>`;
  if(col.t==="gate"){ const g=calcGate(r||{},c,agg); return gateChip(g); }
  if(col.t==="profitTot"){ const g=calcGate(r||{},c,agg); return g.profitTot==null?`<span style="color:var(--txt-faint)">—</span>`:`<span class="${g.profitTot<0?'neg':''}">${fmtRp(g.profitTot)}</span>`; }
  if(col.t==="rp")return `<span class="${(c[col.k]<0)?'neg':''}">${fmtRp(c[col.k])}</span>`;
  if(col.t==="pct")return fmtPct(c[col.k]);
  if(col.t==="x")return fmtX(c[col.k]);
  if(col.t==="int")return c[col.k]!=null?c[col.k]:"—";
  return c[col.k];
}
// chip untuk gate PUSH/MONITOR/STOP/NO_DATA
function gateChip(g){
  const map={PUSH:{c:"aman",ic:"🟢"},MONITOR:{c:"waspada",ic:"🟡"},STOP:{c:"rugi",ic:"🔴"},NO_DATA:{c:"neutral",ic:"➖"}};
  const m=map[g.gate]||map.NO_DATA;
  const est=g.gate!=="NO_DATA"&&!g.hasVol?' <span style="opacity:.6" title="tanpa data volume">≈</span>':'';
  return `<div style="line-height:1.35"><span class="chip ${m.c}" style="padding:1px 7px">${m.ic} ${g.gate}${est}</span><div style="font-size:10.5px;color:var(--txt-dim);margin-top:2px">${g.action}</div></div>`;
}
// update HANYA sel kalkulasi pada satu baris — input yang sedang diketik tidak disentuh (tak ada refresh)
function updateStoreRow(tr,row){
  const c=calcRow(row);
  const econAgg=storeEconomics(current.store);
  STORE_COLS.forEach(col=>{
    if(col.edit) return;
    const cell=tr.querySelector(`td[data-calc="${col.k}"]`);
    if(cell) cell.innerHTML=calcCellDisp(col,c,row,econAgg);
  });
}
// segarkan ringkasan margin/status di toolbar tanpa redraw tabel
function updateStoreSummary(s){
  const ag=aggregate(state.stores[s]);
  const nArsip=archivedRows(s).length;
  const sum=$("#stSummary");
  if(sum)sum.innerHTML=storeUI.showArchived
    ? `<span class="warn">📦 Menampilkan ${nArsip} produk arsip</span>`
    : `Margin total <b>${fmtRp(ag.sumMargin)}</b> · <span class="pos">${ag.aman}</span>/<span class="warn">${ag.waspada}</span>/<span class="neg">${ag.rugi}</span>${nArsip?` · <span style="color:var(--txt-faint)">${nArsip} diarsip</span>`:''}`;
}
function drawPagination(sel,ui,total,pages,cb){
  const p=$(sel);if(!p)return;
  let h=`<span class="pg-info">${total} baris · hal ${ui.page}/${pages}</span>`;
  h+=`<button ${ui.page<=1?'disabled':''} data-pg="prev">‹</button>`;
  const win=[]; for(let i=Math.max(1,ui.page-2);i<=Math.min(pages,ui.page+2);i++)win.push(i);
  if(win[0]>1){h+=`<button data-pg="1">1</button>`;if(win[0]>2)h+=`<span style="color:var(--txt-faint)">…</span>`;}
  win.forEach(i=>h+=`<button class="${i===ui.page?'active':''}" data-pg="${i}">${i}</button>`);
  if(win[win.length-1]<pages){if(win[win.length-1]<pages-1)h+=`<span style="color:var(--txt-faint)">…</span>`;h+=`<button data-pg="${pages}">${pages}</button>`;}
  h+=`<button ${ui.page>=pages?'disabled':''} data-pg="next">›</button>`;
  p.innerHTML=h;
  $$(sel+" [data-pg]").forEach(b=>b.onclick=()=>{const v=b.dataset.pg;if(v==="prev")ui.page--;else if(v==="next")ui.page++;else ui.page=+v;cb();});
}

<script>

/* ============================================================
   #6 AI ADVISOR — brief harian & rekomendasi via Claude API
   Kirim RINGKASAN terstruktur (bukan seluruh data mentah) untuk
   hemat token & jaga fokus. Output: narasi strategi bahasa Indonesia.
   ============================================================ */
function buildAIContext(){
  const gAll=collectGates();
  const gs=gateSummary(gAll);
  const anoms=detectAnomalies();
  const perStore=STORES.map(s=>{
    const econ=storeEconomics(s);
    const ag=aggregate(state.stores[s]);
    return {toko:s, sku_aktif:activeRows(s).length, spend:Math.round(econ.storeSpend), gmv:Math.round(econ.storeGmv),
      blended_roas:econ.storeRoas!=null?+econ.storeRoas.toFixed(2):null, profit_total:Math.round(econ.storeProfit),
      aman:ag.aman, waspada:ag.waspada, rugi:ag.rugi};
  });
  const topOf=(gate,n)=>gAll.filter(x=>x.g.gate===gate).sort((a,b)=>b.g.severity-a.g.severity).slice(0,n)
    .map(x=>({toko:x.store,sku:x.r.sku,product_id:x.r.productId||null,roas:+x.c.roasAkt.toFixed(2),
      target:+x.c.targetRoasIdeal.toFixed(2),bep:+x.c.roasBEP.toFixed(2),
      profit_total:x.g.profitTot!=null?Math.round(x.g.profitTot):null,aksi:x.g.action}));
  return {
    tanggal:new Date().toISOString().slice(0,10),
    ringkasan_gate:{push:gs.PUSH.n,monitor:gs.MONITOR.n,stop:gs.STOP.n,
      potensi_profit_push:Math.round(gs.PUSH.rp),profit_at_risk_stop:Math.round(gs.STOP.rp)},
    per_toko:perStore,
    top_stop:topOf("STOP",5),
    top_push:topOf("PUSH",5),
    top_monitor:topOf("MONITOR",3),
    anomali:anoms.slice(0,8).map(a=>({toko:a.store,sku:a.sku,jenis:a.type,judul:a.title,detail:a.detail})),
    catatan:"ROAS aktual dari GMV Max. Target & BEP dihitung per-SKU dari struktur biaya TikTok Shop (komisi 7.5%+8%+Growth Xtra 4%+affiliate 7%+ops 10% + fee flat + PPN 11%). Profit total = profit/order × order periode."
  };
}

const AI_SYSTEM = `Kamu adalah Senior E-Commerce Strategist & Data Analyst untuk seller TikTok Shop Indonesia multi-toko (headwear & aksesoris). Gaya: langsung, peer-level, bahasa Indonesia kasual-profesional. Kamu menganalisis data ROAS/profit lintas toko dan memberi rekomendasi yang bisa langsung dieksekusi.

Aturan:
- Fokus HANYA pada TikTok Shop Ads (GMV Max, VSA, LIVE Ads, Kartu Produk, Affiliate). JANGAN sarankan Shopee/Tokopedia/Meta Ads.
- Prioritaskan berdasarkan rupiah nyata (profit total & spend), bukan persentase semata.
- Konkret: sebut SKU/Product ID spesifik, angka, dan tindakan (scale +%, matikan, naikkan harga).
- Struktur output: (1) Ringkasan 1-2 kalimat kondisi hari ini, (2) 🔴 Tindakan Mendesak (STOP), (3) 🟢 Peluang Scale (PUSH), (4) ⚠️ Anomali yang perlu dicek, (5) Fokus utama hari ini (1 kalimat).
- Ringkas dan actionable. Jangan bertele-tele. Jangan ulang mentah angka yang sudah jelas — beri interpretasi & keputusan.`;

const advisorState={loading:false,result:null,error:null,mode:null};
function renderAdvisor(c){
  const hasRoas=collectGates().length>0;
  c.innerHTML=`
  <div class="card" style="padding:20px;margin-bottom:16px">
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <div style="flex:1;min-width:240px">
        <b style="font-size:15px">🤖 AI Advisor</b>
        <div class="hint" style="margin-top:4px">Claude menganalisis gate, anomali, dan performa per toko lalu memberi brief strategi harian. Data yang dikirim hanya ringkasan (bukan angka mentah tiap SKU).</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn primary" id="aiBrief" ${!hasRoas?'disabled':''}>📋 Brief Harian</button>
        <button class="btn ghost" id="aiAsk" ${!hasRoas?'disabled':''}>💬 Tanya Bebas</button>
      </div>
    </div>
    ${!hasRoas?'<div class="hint" style="margin-top:12px;color:var(--amber)">⚠ Belum ada SKU dengan ROAS aktual. Import data campaign dulu agar AI punya bahan analisis.</div>':''}
  </div>
  <div id="aiAskBox" style="display:none;margin-bottom:16px">
    <div class="card" style="padding:16px">
      <label class="fld">Pertanyaan ke AI (konteks data toko otomatis disertakan)</label>
      <textarea id="aiQ" class="select" style="width:100%;min-height:70px;resize:vertical;font-family:var(--sans)" placeholder="Contoh: Toko mana yang paling boros budget? SKU apa yang harus aku prioritaskan scale minggu ini?"></textarea>
      <div style="margin-top:10px"><button class="btn primary sm" id="aiQSend">Kirim</button></div>
    </div>
  </div>
  <div id="aiOut"></div>`;

  $("#aiAsk").onclick=()=>{ const b=$("#aiAskBox"); b.style.display=b.style.display==="none"?"block":"none"; };
  $("#aiBrief").onclick=()=>runAdvisor("brief");
  $("#aiQSend").onclick=()=>{ const q=$("#aiQ").value.trim(); if(q)runAdvisor("ask",q); };

  // restore hasil terakhir jika ada
  if(advisorState.result||advisorState.error||advisorState.loading) paintAdvisorOut();
}
function paintAdvisorOut(){
  const out=$("#aiOut"); if(!out)return;
  if(advisorState.loading){
    out.innerHTML=`<div class="card" style="padding:24px;text-align:center"><div class="spinner" style="margin:0 auto 12px"></div><div class="hint">Claude sedang menganalisis data toko…</div></div>`;
    return;
  }
  if(advisorState.error){
    out.innerHTML=`<div class="card" style="padding:20px;border-left:3px solid var(--red)"><b class="neg">Gagal memanggil AI</b><div class="hint" style="margin-top:6px">${advisorState.error}</div><div class="hint" style="margin-top:8px">Fitur ini butuh koneksi ke Claude API dan berjalan saat dashboard dibuka di dalam Claude (artifact). Jika kamu membuka file HTML langsung di browser biasa, panggilan API tidak tersedia.</div></div>`;
    return;
  }
  if(advisorState.result){
    out.innerHTML=`<div class="card" style="padding:22px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px"><span class="badge" style="background:var(--teal-dim);color:var(--teal)">🤖 ${advisorState.mode==="brief"?"Brief Harian":"Jawaban AI"}</span><span class="hint" style="margin-left:auto">${new Date().toLocaleString("id-ID")}</span></div>
      <div class="ai-md" style="line-height:1.65;font-size:13.5px">${mdLite(advisorState.result)}</div>
    </div>`;
  }
}
// markdown ringan → HTML (heading, bold, list, emoji tetap)
function mdLite(t){
  let h=t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  h=h.replace(/^### (.*)$/gm,'<h4 style="margin:14px 0 6px;font-size:14px">$1</h4>')
     .replace(/^## (.*)$/gm,'<h3 style="margin:16px 0 8px;font-size:15px">$1</h3>')
     .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
     .replace(/^\s*[-*] (.*)$/gm,'<li style="margin:3px 0">$1</li>')
     .replace(/(<li[\s\S]*?<\/li>)/g,'<ul style="margin:6px 0;padding-left:20px">$1</ul>')
     .replace(/\n{2,}/g,'</p><p style="margin:8px 0">')
     .replace(/\n/g,'<br>');
  return '<p style="margin:8px 0">'+h+'</p>';
}
async function runAdvisor(mode,question){
  advisorState.loading=true; advisorState.error=null; advisorState.result=null; advisorState.mode=mode;
  paintAdvisorOut();
  const ctx=buildAIContext();
  const userMsg = mode==="brief"
    ? `Berikut ringkasan data TikTok Shop hari ini (JSON). Buatkan BRIEF HARIAN sesuai struktur yang diminta.\n\n${JSON.stringify(ctx,null,1)}`
    : `Pertanyaan: ${question}\n\nKonteks data toko hari ini (JSON):\n${JSON.stringify(ctx,null,1)}`;
  try{
    const resp=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({ model:"claude-sonnet-4-5", max_tokens:1500,
        system:AI_SYSTEM, messages:[{role:"user",content:userMsg}] })
    });
    if(!resp.ok){
      let detail="";
      try{ const e=await resp.json(); detail=e?.error?.message||JSON.stringify(e); }catch(_){ detail=resp.statusText||""; }
      throw new Error("HTTP "+resp.status+(detail?" — "+detail:""));
    }
    const data=await resp.json();
    const txt=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
    advisorState.result = txt || "(AI tidak mengembalikan teks)";
  }catch(err){
    advisorState.error = err.message||String(err);
  }finally{
    advisorState.loading=false; paintAdvisorOut();
  }
}
